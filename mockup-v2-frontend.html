<title>Hub Luh Panda — Mockup</title>
<style>
:root{
  --fundo:#12081A; --poco:#0C0512; --superficie:#1A0E24;
  --borda:#2C1A3A; --borda-forte:#3A2249;
  --roxo:#6F2E8F; --roxo-claro:#8B4BA3; --laranja:#FF6B35; --zap:#25D366;
  --texto:#F2EAF7; --suave:#C4B2D1; --fraco:#8B7A98;
  --ok:#25D366; --warn:#F2C14E; --bad:#FF5C7A;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:var(--fundo);color:var(--texto);font-family:var(--sans);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
.aurora{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.aurora i{position:absolute;display:block;border-radius:50%;filter:blur(90px);opacity:.4}
.aurora .a1{width:640px;height:640px;top:-280px;left:10%;background:radial-gradient(circle,rgba(111,46,143,.75),transparent 68%)}
.aurora .a2{width:520px;height:520px;top:-160px;right:-140px;background:radial-gradient(circle,rgba(255,107,53,.28),transparent 66%)}
.aurora .a3{width:760px;height:420px;bottom:-200px;left:35%;background:radial-gradient(ellipse,rgba(139,75,163,.35),transparent 70%)}
a{color:inherit}
.muted{color:var(--suave)}.dim{color:var(--fraco)}
::selection{background:rgba(255,107,53,.35)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--laranja);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

/* ---------- shell ---------- */
.app{display:flex;align-items:flex-start;min-height:100vh;position:relative;z-index:1}
.sidebar{
  width:232px;flex-shrink:0;display:flex;flex-direction:column;gap:20px;
  position:sticky;top:0;height:100vh;padding:22px 14px 18px;
  border-right:1px solid var(--borda);background:rgba(12,5,18,.72);backdrop-filter:blur(8px);
}
.marca{font-weight:600;letter-spacing:-.02em;font-size:1.02rem;padding:0 8px;display:flex;align-items:center;gap:9px}
.marca .dot{
  width:30px;height:30px;border-radius:9px;flex-shrink:0;font-size:17px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,107,53,.14);border:1px solid rgba(255,107,53,.4);
  filter:drop-shadow(0 0 6px rgba(255,107,53,.35));
}
.marca em{font-style:normal;color:var(--laranja)}
.nav{display:flex;flex-direction:column;flex:1;overflow-y:auto;scrollbar-width:thin}
.nav-top{margin-bottom:18px}
.nav-group + .nav-group{margin-top:18px}
.nav-group-label{
  font-family:var(--mono);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--fraco);padding:0 10px;margin-bottom:6px;
}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:6px 10px;border-radius:10px;
  font-size:13px;color:var(--suave);cursor:pointer;border:1px solid transparent;margin-bottom:2px;
  transition:color .15s var(--ease);
}
.nav-icon{
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  width:30px;height:30px;border-radius:9px;
  background:var(--superficie);border:1px solid var(--borda);color:var(--fraco);
  transition:all .15s var(--ease);
}
.nav-item:hover{color:var(--texto)}
.nav-item:hover .nav-icon{color:var(--texto);border-color:var(--borda-forte)}
.nav-item.active{color:var(--texto)}
.nav-item.active .nav-icon{background:rgba(255,107,53,.14);border-color:rgba(255,107,53,.45);color:var(--laranja)}
.side-foot{border-top:1px solid var(--borda);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.side-foot .email{font-size:11px;color:var(--fraco);word-break:break-all;padding:0 2px}

.wrap{flex:1;min-width:0;max-width:1240px;margin:0 auto;padding:30px 34px 90px}

/* ---------- primitivas ---------- */
.eyebrow{font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.16em;color:var(--laranja);margin:0 0 6px}
h1.page{font-size:1.55rem;letter-spacing:-.03em;font-weight:600;margin:0;text-wrap:balance}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.row{display:flex;align-items:center;gap:10px}
.btn{
  font-size:13px;font-weight:600;border-radius:10px;padding:9px 16px;cursor:pointer;
  border:1px solid var(--borda-forte);background:var(--superficie);color:var(--texto);
  transition:filter .15s var(--ease);display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{filter:brightness(1.2)}
.btn-primary{background:var(--laranja);border-color:var(--laranja);color:#1A0A04}
.btn-ghost{background:transparent}
.btn-danger{background:transparent;border-color:rgba(255,92,122,.45);color:var(--bad)}
.btn-sm{padding:5px 11px;font-size:12px;border-radius:8px}
.btn-ico{padding:5px 8px;font-size:12px;border-radius:8px;background:transparent;border-color:var(--borda);color:var(--fraco)}
.btn-ico:hover{color:var(--texto);border-color:var(--borda-forte)}
.card{background:var(--superficie);border:1px solid var(--borda);border-radius:14px;padding:20px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
.kpi{background:var(--superficie);border:1px solid var(--borda);border-radius:13px;padding:15px 17px}
.kpi-head{display:flex;align-items:center;gap:7px;color:var(--fraco);margin-bottom:3px}
.kpi-head svg{flex-shrink:0}
.kpi .label{font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase}
.kpi .value{font-size:23px;font-weight:600;letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:11.5px;color:var(--fraco);margin-top:2px}
.kpi.warn .value,.kpi.warn .kpi-head{color:var(--warn)}
.kpi.bad .value,.kpi.bad .kpi-head{color:var(--bad)}
.kpi.ok .value,.kpi.ok .kpi-head{color:var(--ok)}

table{width:100%;border-collapse:separate;border-spacing:0 8px;font-size:13.5px}
thead th{
  text-align:left;font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--fraco);padding:0 14px 4px;font-weight:500;
}
tbody tr{background:var(--superficie)}
tbody tr.click{cursor:pointer;transition:filter .12s var(--ease)}
tbody tr.click:hover{filter:brightness(1.18)}
tbody td{padding:12px 14px;border-top:1px solid var(--borda);border-bottom:1px solid var(--borda)}
tbody tr td:first-child{border-left:1px solid var(--borda);border-radius:11px 0 0 11px}
tbody tr td:last-child{border-right:1px solid var(--borda);border-radius:0 11px 11px 0}
.tablewrap{overflow-x:auto}
.money{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;white-space:nowrap}
th.num{text-align:right}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.b-ok{color:var(--ok)} .b-warn{color:var(--warn)} .b-bad{color:var(--bad)} .b-mut{color:var(--fraco);border-color:var(--borda-forte)} .b-roxo{color:var(--roxo-claro)} .b-lar{color:var(--laranja)}
.svc{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:rgba(139,75,163,.14);border:1px solid rgba(139,75,163,.4);color:var(--roxo-claro);white-space:nowrap}
.svc.trafego{background:rgba(255,107,53,.1);border-color:rgba(255,107,53,.4);color:var(--laranja)}
.svc.bot{background:rgba(37,211,102,.08);border-color:rgba(37,211,102,.35);color:var(--zap)}
.svc.social{background:rgba(196,178,209,.08);border-color:rgba(196,178,209,.35);color:var(--suave)}
.svc.fixo{background:rgba(242,193,78,.08);border-color:rgba(242,193,78,.4);color:var(--warn)}

.empty{padding:60px 20px;text-align:center;color:var(--fraco)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.gridcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px}
@media(max-width:980px){.grid2,.grid3{grid-template-columns:1fr}}

/* filtros (chips) */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{font-size:12px;font-weight:600;padding:5px 13px;border-radius:999px;border:1px solid var(--borda-forte);
  background:transparent;color:var(--fraco);cursor:pointer;transition:all .12s var(--ease)}
.chip:hover{color:var(--texto)}
.chip.on{background:rgba(255,107,53,.13);border-color:rgba(255,107,53,.45);color:var(--laranja)}

/* preço caixinha */
.preco-card{background:var(--superficie);border:1px solid var(--borda);border-radius:14px;padding:17px 18px;
  display:flex;flex-direction:column;gap:7px;transition:border-color .15s var(--ease);position:relative}
.preco-card:hover{border-color:var(--borda-forte)}
.preco-card .tipo{font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--fraco)}
.preco-card .nome{font-weight:600;font-size:14px;letter-spacing:-.01em;padding-right:30px}
.preco-card .valor{font-size:19px;font-weight:600;color:var(--laranja);font-variant-numeric:tabular-nums}
.preco-card .inclui{font-size:12px;color:var(--suave);line-height:1.45}
.preco-card .obs{font-size:11px;color:var(--fraco);border-top:1px solid var(--borda);padding-top:7px;margin-top:2px}
.preco-card .edit{position:absolute;top:12px;right:12px}

/* ---------- kanban ---------- */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(215px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.kcol{background:rgba(26,14,36,.55);border:1px solid var(--borda);border-radius:13px;padding:12px;min-height:220px}
.kcol-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 2px}
.kcol-title{font-family:var(--mono);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--suave)}
.kcol-count{font-size:10.5px;color:var(--fraco);background:var(--superficie);border:1px solid var(--borda);border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums}
.kcard{background:var(--superficie);border:1px solid var(--borda-forte);border-radius:11px;padding:11px 12px;margin-bottom:8px;cursor:pointer;transition:all .15s var(--ease)}
.kcard:hover{border-color:var(--laranja);transform:translateY(-1px)}
.kcard .nome{font-weight:600;font-size:13px;letter-spacing:-.01em}
.kcard .meta{font-size:11.5px;color:var(--fraco);margin-top:3px;display:flex;justify-content:space-between;gap:6px}
.kcard .valor{color:var(--laranja);font-weight:600;font-variant-numeric:tabular-nums}

/* ---------- steps ---------- */
.steps{display:flex;flex-direction:column;margin:6px 0}
.step{display:flex;gap:12px;position:relative;padding-bottom:16px}
.step::before{content:"";position:absolute;left:11px;top:26px;bottom:2px;width:2px;background:var(--borda)}
.step:last-child::before{display:none}
.step-dot{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:var(--superficie);border:2px solid var(--borda-forte);color:var(--fraco);font-size:11px;z-index:1}
.step.done .step-dot{background:rgba(37,211,102,.15);border-color:var(--ok);color:var(--ok)}
.step.now .step-dot{background:rgba(255,107,53,.15);border-color:var(--laranja);color:var(--laranja);box-shadow:0 0 0 4px rgba(255,107,53,.1)}
.step-body{padding-top:2px;flex:1}
.step-title{font-weight:600;font-size:13.5px}
.step.done .step-title{color:var(--suave)}
.step-sub{font-size:12px;color:var(--fraco)}
.step-act{margin-top:6px}

/* ---------- listas ricas ---------- */
.rowcard{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--superficie);
  border:1px solid var(--borda);border-radius:12px;padding:13px 16px;margin-bottom:9px;transition:filter .12s var(--ease)}
.rowcard.click{cursor:pointer}
.rowcard.click:hover{filter:brightness(1.15)}
.rowcard .l{min-width:0;flex:1}
.rowcard .t{font-weight:600;font-size:13.5px;letter-spacing:-.01em}
.rowcard .s{font-size:12px;color:var(--fraco);margin-top:1px}
.rowcard .r{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}

.alerta{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-radius:11px;
  font-size:12.5px;margin-bottom:8px;cursor:pointer}
.alerta.bad{background:rgba(255,92,122,.07);border:1px solid rgba(255,92,122,.28)}
.alerta.warn{background:rgba(242,193,78,.06);border:1px solid rgba(242,193,78,.25)}

.thumb{width:44px;height:44px;border-radius:9px;flex-shrink:0;background:linear-gradient(135deg,var(--roxo),var(--laranja));opacity:.75}
.thumb.v2{background:linear-gradient(135deg,var(--roxo-claro),var(--roxo))}
.thumb.v3{background:linear-gradient(135deg,var(--laranja),var(--roxo-claro))}

.back{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--fraco);text-decoration:none;margin-bottom:14px;cursor:pointer}
.back:hover{color:var(--texto)}

/* ---------- modal ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(6,2,10,.78);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
.modal{background:var(--superficie);border:1px solid var(--borda-forte);border-radius:16px;padding:24px;
  max-width:540px;width:100%;max-height:88vh;overflow:auto}
.modal.wide{max-width:680px}
.modal h3{margin:0 0 14px;font-size:1.1rem;letter-spacing:-.02em}
.field{margin-bottom:12px}
.field label{display:block;font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--fraco);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;font-family:inherit;font-size:13px;background:var(--poco);
  color:var(--texto);border:1px solid var(--borda-forte);border-radius:9px;padding:9px 12px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--laranja)}
.field input::placeholder,.field textarea::placeholder{color:var(--fraco)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:520px){.f2{grid-template-columns:1fr}}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.contrato-prev{font-family:var(--mono);font-size:11.5px;line-height:1.7;color:var(--suave);background:var(--poco);
  border:1px solid var(--borda);border-radius:10px;padding:16px;white-space:pre-wrap;max-height:300px;overflow:auto}

/* ---------- toast ---------- */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--superficie);
  border:1px solid var(--laranja);color:var(--texto);padding:10px 18px;border-radius:11px;font-size:13px;z-index:100;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.6)}

/* ---------- chart ---------- */
.chart-wrap{width:100%;overflow-x:auto}
.chart-wrap svg{display:block;width:100%;height:auto;min-width:340px}
.chart-caption{font-size:11.5px;color:var(--fraco);margin-top:8px;display:flex;gap:16px;flex-wrap:wrap}
.chart-caption .key{display:inline-flex;align-items:center;gap:6px}
.chart-caption .sw{width:10px;height:10px;border-radius:3px;display:inline-block}

/* ---------- tráfego cards ---------- */
.traf-card{background:var(--superficie);border:1px solid var(--borda);border-radius:14px;padding:18px;margin-bottom:14px}
.traf-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.traf-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:10px}
.traf-m{background:var(--poco);border:1px solid var(--borda);border-radius:10px;padding:10px 12px}
.traf-m .l{font-family:var(--mono);font-size:.56rem;letter-spacing:.12em;text-transform:uppercase;color:var(--fraco)}
.traf-m .v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.traf-note{font-size:12px;color:var(--fraco);border-top:1px solid var(--borda);padding-top:10px}

/* ---------- responsivo ---------- */
@media (max-width:760px){
  .wrap{padding:20px 14px 60px}
  .app{flex-direction:column}
  .sidebar{position:sticky;top:0;z-index:20;height:auto;width:100%;flex-direction:row;align-items:center;gap:10px;
    border-right:none;border-bottom:1px solid var(--borda);padding:10px 12px}
  .marca{flex-shrink:0;padding:0}
  .nav{flex-direction:row;flex:1;overflow-x:auto;overflow-y:hidden;gap:2px}
  .nav-top{margin-bottom:0}
  .nav-group{display:contents}
  .nav-group-label{display:none}
  .nav-item{flex-direction:column;gap:3px;padding:5px 8px;font-size:9.5px;white-space:nowrap;margin-bottom:0}
  .nav-icon{width:26px;height:26px}
  .side-foot{flex-direction:row;border-top:none;padding-top:0;flex-shrink:0}
  .side-foot .email{display:none}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .tablewrap table,.tablewrap thead,.tablewrap tbody,.tablewrap th,.tablewrap td,.tablewrap tr{display:block}
  .tablewrap thead{position:absolute;left:-9999px}
  .tablewrap tbody tr{margin-bottom:10px;border:1px solid var(--borda);border-radius:12px;padding:4px 2px}
  .tablewrap tbody td{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 13px;
    border:none;border-bottom:1px solid var(--borda);border-radius:0 !important;text-align:right}
  .tablewrap tbody td:last-child{border-bottom:none}
  .tablewrap tbody td::before{content:attr(data-l);font-family:var(--mono);font-size:.58rem;letter-spacing:.08em;
    text-transform:uppercase;color:var(--fraco);text-align:left;flex-shrink:0}
}
@media (max-width:420px){.kpis{grid-template-columns:1fr}}
</style>

<div class="aurora"><i class="a1"></i><i class="a2"></i><i class="a3"></i></div>
<div class="app">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="wrap" id="main"></main>
</div>
<div id="modal-root"></div>

<script>
// ============================================================
// Hub Luh Panda — MOCKUP v2 · dados reais da planilha Set/2026
// Tudo editável em memória (não persiste — é maquete de aprovação)
// ============================================================
const IC = {
  visao:`<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>`,
  receb:`<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2.5" x2="12" y2="21.5"/><path d="M16.5 6.8c0-1.8-2-3-4.5-3s-4.5 1.3-4.5 3.1c0 3.9 9 1.9 9 5.9 0 2-2 3.2-4.5 3.2S7 14.8 7 12.9"/></svg>`,
  clientes:`<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c0-3.7 2.5-6 5.5-6s5.5 2.3 5.5 6"/><path d="M15.5 5.2a3.2 3.2 0 0 1 0 5.9M17.5 14.6c1.8.8 3 2.6 3 5.4"/></svg>`,

const modalRoot = document.getElementById('modal-root');
function openModal(title, bodyHtml, wide){
  modalRoot.innerHTML = `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
    <div class="modal ${wide?'wide':''}"><h3>${title}</h3>${bodyHtml}</div></div>`;
}
function closeModal(){ modalRoot.innerHTML=''; }

// builder de formulário: fields = [{k,label,type:'text|number|select|textarea',options,half}]
function formHtml(fields, values, submitLabel){
  const inner = fields.map(f=>{
    const v = values[f.k] ?? '';
    let input;
    if(f.type==='select') input = `<select id="fx-${f.k}">${f.options.map(o=>{
      const [val,lab] = Array.isArray(o)?o:[o,o];
      return `<option value="${esc(val)}" ${String(v)===String(val)?'selected':''}>${esc(lab)}</option>`;}).join('')}</select>`;
    else if(f.type==='textarea') input = `<textarea id="fx-${f.k}" rows="2">${esc(v)}</textarea>`;
    else input = `<input id="fx-${f.k}" type="${f.type||'text'}" ${f.type==='number'?'step="0.01"':''} value="${esc(v)}" placeholder="${esc(f.ph||'')}">`;
    return `<div class="field ${f.half?'half':''}"><label>${f.label}</label>${input}</div>`;
  }).join('');
  return `<form onsubmit="return _submitForm(event)">${inner}
    <div class="modal-foot">
      <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button type="submit" class="btn btn-primary">${submitLabel||'Salvar'}</button>
    </div></form>`;
}
let _onSubmit = null;
function _submitForm(ev){
  ev.preventDefault();

function vProspect(id){
  const p = DB.prospects.find(x=>x.id===id); if(!p) return `<div class="empty">Prospect não encontrado.</div>`;
  const steps = ONBOARD.map((t,i)=>{
    const done = i<=p.col, now = i===p.col+1;
    return `<div class="step ${done?'done':''} ${now?'now':''}">
      <div class="step-dot">${done?'✓':i+1}</div>
      <div class="step-body">
        <div class="step-title">${t}</div>
        ${i===1&&p.gravacao?'<div class="step-sub">gravação no Meetily · resumo pronto (API entra na fase de ligação)</div>':''}
        ${i===2&&p.valor?`<div class="step-sub">valor fechado: ${BRL(p.valor)}</div>`:''}
        ${now?`<div class="step-act"><button class="btn btn-sm btn-primary" onclick="${i===5?'novoContrato()':`toast('No sistema real: ${i===2?'abre a precificação':i===3?'gera o PDF do orçamento':i===4?'envia via WhatsApp (Evolution)':'abre o cliente com os serviços'}.')`}">${
          i===2?'Precificar':i===3?'Gerar PDF do orçamento':i===4?'Enviar via WhatsApp':i===5?'Emitir contrato':i===6?'Abrir cliente':'Avançar'
        }</button></div>`:''}
      </div>
    </div>`;
  }).join('');
  return `<span class="back" onclick="location.hash='#/crm'">← voltar pro CRM</span>` +
    head('Comercial · ' + KCOLS[p.col], esc(p.nome), `
      <button class="btn btn-sm" onclick="editProspect('${p.id}')">${IC.pen} Editar</button>
      <button class="btn btn-sm" onclick="toast('Twenty CRM entra na fase de integração.')">${IC.ext} Abrir no Twenty</button>
    `) + `
    <div class="grid2">
      <div class="card">
        <p class="eyebrow" style="color:var(--fraco)">Onboarding</p>
        <div class="steps">${steps}</div>
      </div>
      <div>
        <div class="card" style="margin-bottom:14px">
          <p class="eyebrow" style="color:var(--fraco)">Resumo</p>
          <p class="muted" style="margin:0;font-size:13.5px">${esc(p.nota)}</p>
          <div class="row" style="margin-top:12px;flex-wrap:wrap">
            ${p.valor?`<span class="badge b-lar">${BRL(p.valor)}</span>`:''}
            ${p.gravacao?'<span class="badge b-roxo">🎥 Meetily</span>':''}
            <span class="badge b-mut">${esc(p.data)}</span>
          </div>
        </div>
        <div class="card">
          <p class="eyebrow" style="color:var(--fraco)">Ações rápidas</p>
          <div class="row" style="flex-wrap:wrap;gap:8px">
            <button class="btn btn-sm" onclick="toast('Abre a gravação/resumo no Meetily (API na fase de ligação).')">${IC.play} Ver gravação</button>
            <button class="btn btn-sm" onclick="toast('No sistema real: PDF do orçamento.')">${IC.doc} Orçamento PDF</button>
            <button class="btn btn-sm" onclick="toast('No sistema real: conversa no WhatsApp.')">${IC.zap} WhatsApp</button>
          </div>
        </div>
      </div>
    </div>`;
}

// ============================================================
// ROTA
// ============================================================
const ROTAS = {
  visao:vVisao, recebiveis:vRecebiveis, clientes:vClientes, precos:vPrecos,
  custos:vCustos, cobrancas:vCobrancas, crm:vCRM, contratos:vContratos,
  reunioes:vReunioes, posts:vPosts, trafego:vTrafego, criacao:vCriacao, dev:vDev,
};
function render(){
  const h = location.hash.replace(/^#\/?/,'');
  const [page,param] = h.split('/');
  let active = page||'visao', html;
  if(page==='cliente'){ active='clientes'; html=vCliente(param); }
  else if(page==='prospect'){ active='crm'; html=vProspect(param); }
  else html = (ROTAS[active]||vVisao)();
  sidebar(active);
  document.getElementById('main').innerHTML = html;
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', render);
render();
</script>
