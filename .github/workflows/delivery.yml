name: delivery adapters
on:
  pull_request:
    paths: ["integrations/delivery/**", ".github/workflows/delivery.yml"]
  push:
    paths: ["integrations/delivery/**", ".github/workflows/delivery.yml"]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: node --test integrations/delivery/*.test.mjs
