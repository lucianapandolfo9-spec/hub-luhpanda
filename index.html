<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub Luh Panda</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

<div id="root">
  <div class="empty"><div class="spinner" style="margin:0 auto 12px;"></div>Carregando...</div>
</div>
<div id="modal-root"></div>

<script src="config.js"></script>
<script>
const root = document.getElementById('root');
const modalRoot = document.getElementById('modal-root');
let session = null;
let carteira = [];   // cache pra popular <select> de cliente em formulários

// ============================================================
// HELPERS
// ============================================================
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3200);
}
function centavosToBRL(c){
  if(c==null) return '—';
  return (Number(c)/100).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
}
function centavosCompact(c){
  const v = Number(c||0)/100;
  if(v >= 1000) return 'R$' + (v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1}) + 'k';
  return 'R$' + v.toLocaleString('pt-BR',{maximumFractionDigits:0});
}
function brlInputToCentavos(v){
  if(v === '' || v == null) return null;
  return Math.round(parseFloat(String(v).replace(',','.')) * 100);
}
function centavosToInputValue(c){
  if(c == null) return '';
  return (Number(c)/100).toFixed(2);
}
function todayISO(){
  return new Date().toLocaleDateString('sv-SE'); // yyyy-mm-dd no fuso local
}
function formatDateBR(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function monthLabel(competenciaISO){
  const meses = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const m = parseInt(competenciaISO.split('-')[1], 10) - 1;
  return meses[m];
}
function slugify(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}
function statusLabel(s){
  return {
    prospect:'Prospect', ativo:'Ativo', pausado:'Pausado', encerrado:'Encerrado',
    rascunho:'Rascunho', emitido:'Emitido', enviado:'Enviado', assinado:'Assinado',
    aberto:'Aberto', parcial:'Parcial', pago:'Pago', vencido:'Vencido',
  }[s] || s;
}
function contratoBadgeClass(status){
  if(status === 'ativo' || status === 'assinado' || status === 'pago') return 'badge-ok';
  if(status === 'rascunho' || status === 'parcial' || status === 'aberto') return 'badge-warn';
  if(status === 'vencido') return 'badge-bad';
  return 'badge-muted';
}
function friendlyError(err){
  const m = (err && err.message) || String(err);
  if(m.includes('hub_contrato_ativo_exige_porta_saida')) return 'Não dá pra ativar o contrato sem porta de saída escrita.';
  if(m.includes('acesso negado')) return 'Sessão sem permissão pra essa ação.';
  return m;
}
async function rpc(name, params){
  const { data, error } = await hubClient.rpc(name, params || {});
  if(error){ toast(friendlyError(error)); throw error; }
  return data;
}

// ---------- modal genérico ----------
function openModal(titleHtml, bodyHtml){
  modalRoot.innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h3>${titleHtml}</h3>
        ${bodyHtml}
      </div>
    </div>`;
}
function closeModal(){ modalRoot.innerHTML = ''; }

// ============================================================
// ROTA (hash)
// ============================================================
function currentRoute(){
  const h = location.hash.replace(/^#\/?/, '');
  const [page, ...rest] = h.split('/');
  return { page: page || 'dash', param: rest.join('/') };
}
window.addEventListener('hashchange', render);

// ============================================================
// AUTH
// ============================================================
async function init(){
  const { data } = await hubClient.auth.getSession();
  session = data.session;
  hubClient.auth.onAuthStateChange((_event, s) => { session = s; render(); });
  render();
}

function renderLogin(){
  root.innerHTML = `
  <div class="topbar"><div class="brandmark"><span class="dot"></span> Hub <span class="muted">Luh Panda</span></div></div>
  <div class="login-box card">
    <h2 style="margin-top:0;">Entrar</h2>
    <p class="muted">Link mágico direto pro seu e-mail.</p>
    <div class="stack">
      <input type="email" id="login-email" placeholder="seu@email.com" value="${esc(HUB_ADMIN_EMAIL)}">
      <button class="btn btn-primary" onclick="doLogin()">Enviar link de acesso</button>
      <div id="login-msg" class="muted"></div>
    </div>
  </div>`;
}

async function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const msg = document.getElementById('login-msg');
  msg.textContent = 'Enviando...';
  const { error } = await hubClient.auth.signInWithOtp({
    email, options:{ emailRedirectTo: location.href.split('?')[0].split('#')[0] }
  });
  msg.textContent = error ? 'Erro ao enviar. Tenta de novo.' : 'Link enviado — confere seu e-mail.';
}

async function logout(){ await hubClient.auth.signOut(); render(); }

function renderAcessoNegado(){
  root.innerHTML = `
  <div class="topbar"><div class="brandmark"><span class="dot"></span> Hub <span class="muted">Luh Panda</span></div></div>
  <div class="wrap">
    <div class="card" style="max-width:480px;margin:60px auto;text-align:center;">
      <h2>Acesso negado</h2>
      <p class="muted">Esta sessão (${esc(session.user.email)}) não é a administradora do hub.</p>
      <button class="btn btn-outline" onclick="logout()">Sair</button>
    </div>
  </div>`;
}

// ============================================================
// SHELL
// ============================================================
function shell(activePage, bodyHtml){
  const tabs = [
    ['dash','Dash'],
    ['carteira','Carteira'],
    ['financeiro','Financeiro'],
    ['custos','Custos'],
    ['catalogo','Catálogo'],
  ];
  return `
  <div class="topbar">
    <div class="row" style="gap:22px;">
      <div class="brandmark"><span class="dot"></span> Hub <span class="muted">Luh Panda</span></div>
      <div class="tabs">
        ${tabs.map(([p,l]) => `<div class="tab ${p===activePage?'active':''}" onclick="location.hash='#/${p}'">${l}</div>`).join('')}
      </div>
    </div>
    <div class="row">
      <span class="muted">${esc(session.user.email)}</span>
      <button class="btn btn-outline btn-sm" onclick="logout()">Sair</button>
    </div>
  </div>
  <div class="wrap">${bodyHtml}</div>`;
}

// ============================================================
// DASH
// ============================================================
async function loadCarteiraCache(){
  if(!carteira.length) carteira = await rpc('hub_rpc_carteira').catch(()=>[]);
  return carteira;
}

function velocimetroMEI(v){
  const entrado = Number(v.entrado_ano_centavos||0);
  const teto = Number(v.teto_centavos||8100000);
  const pct = Math.min((entrado/teto)*100, 100);
  const cls = entrado >= teto ? 'bad' : (pct >= 80 ? 'warn' : '');
  return `
  <div class="card">
    <div class="row-between">
      <div class="label" style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);">Teto MEI — ${new Date().getFullYear()}</div>
      <div class="muted" style="font-size:12.5px;">${centavosToBRL(entrado)} de ${centavosToBRL(teto)}</div>
    </div>
    <div class="veloc">
      <div class="veloc-track"><div class="veloc-fill ${cls}" style="width:${pct.toFixed(1)}%"></div></div>
      <div class="veloc-labels"><span>0</span><span>${pct.toFixed(0)}%</span><span>R$ 81.000</span></div>
    </div>
  </div>`;
}

function chartReceitaPorMes(porMes){
  if(!porMes.length) return `<div class="empty">Sem dados ainda.</div>`;
  const W = 640, H = 220, padL = 8, padR = 8, padT = 24, padB = 34;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const maxVal = Math.max(...porMes.map(m => Math.max(m.previsto_centavos||0, m.entrado_centavos||0)), 1) * 1.15;
  const n = porMes.length;
  const slot = plotW / n;
  const barW = Math.min(28, slot * 0.42);

  const bars = porMes.map((m, i) => {
    const cx = padL + slot * i + slot/2;
    const entradoH = (Number(m.entrado_centavos||0)/maxVal) * plotH;
    const previstoY = padT + plotH - (Number(m.previsto_centavos||0)/maxVal) * plotH;
    const barY = padT + plotH - entradoH;
    const label = centavosCompact(m.entrado_centavos);
    return `
      <g>
        <rect x="${(cx-barW/2).toFixed(1)}" y="${barY.toFixed(1)}" width="${barW}" height="${Math.max(entradoH,1).toFixed(1)}"
          rx="4" fill="var(--blue)">
          <title>${monthLabel(m.competencia)}: entrou ${centavosToBRL(m.entrado_centavos)} de ${centavosToBRL(m.previsto_centavos)} previsto</title>
        </rect>
        <line x1="${(cx-barW/2-3).toFixed(1)}" y1="${previstoY.toFixed(1)}" x2="${(cx+barW/2+3).toFixed(1)}" y2="${previstoY.toFixed(1)}"
          stroke="var(--muted)" stroke-width="2" stroke-dasharray="3,3">
          <title>Previsto: ${centavosToBRL(m.previsto_centavos)}</title>
        </line>
        ${entradoH > 16 ? `<text x="${cx.toFixed(1)}" y="${(barY-6).toFixed(1)}" text-anchor="middle" font-size="11" fill="var(--text)" font-weight="600">${label}</text>` : ''}
        <text x="${cx.toFixed(1)}" y="${H-12}" text-anchor="middle" font-size="11" fill="var(--muted)">${monthLabel(m.competencia)}</text>
      </g>`;
  }).join('');

  const gridlines = [0,0.25,0.5,0.75,1].map(f => {
    const y = padT + plotH * (1-f);
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
  }).join('');

  const tableRows = porMes.map(m => `
    <tr>
      <td data-label="Mês">${monthLabel(m.competencia)}</td>
      <td data-label="Previsto" class="money">${centavosToBRL(m.previsto_centavos)}</td>
      <td data-label="Entrou" class="money">${centavosToBRL(m.entrado_centavos)}</td>
    </tr>`).join('');

  return `
    <div class="chart-wrap">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
        ${gridlines}
        ${bars}
      </svg>
    </div>
    <div class="chart-caption">
      <span class="key"><span class="swatch bar"></span> Quanto entrou</span>
      <span class="key"><span class="swatch target"></span> Previsto no mês</span>
    </div>
    <button class="chart-toggle" onclick="this.nextElementSibling.classList.toggle('open')">ver como tabela ▾</button>
    <div class="chart-table tablewrap">
      <table><thead><tr><th>Mês</th><th>Previsto</th><th>Entrou</th></tr></thead><tbody>${tableRows}</tbody></table>
    </div>`;
}

async function renderDash(){
  root.innerHTML = shell('dash', `<div class="empty"><div class="spinner" style="margin:0 auto;"></div></div>`);
  let dash;
  try { dash = await rpc('hub_rpc_dash'); }
  catch(e){ root.innerHTML = shell('dash', `<div class="empty">Não consegui carregar o dash.</div>`); return; }

  const mesAtual = dash.hoje.slice(0,7) + '-01';
  const doMes = (dash.por_mes || []).find(m => m.competencia === mesAtual) || {previsto_centavos:0, entrado_centavos:0};
  const falta = Number(doMes.previsto_centavos||0) - Number(doMes.entrado_centavos||0);
  const vencidos = dash.vencidos_hoje_ou_antes || [];
  const semVenc = dash.sem_vencimento || [];

  const alertHtml = (vencidos.length + semVenc.length) ? `
    <h2 class="section-title" style="margin-top:28px;">Precisa de atenção</h2>
    <div class="alertlist">
      ${vencidos.map(v => `
        <div class="alertrow" onclick="location.hash='#/cliente/${esc(v.cliente_slug)}'">
          <span>🔴 <b>${esc(v.cliente_nome)}</b> venceu ${v.vence_em ? 'em '+formatDateBR(v.vence_em) : ''}</span>
          <span class="money">${centavosToBRL(v.falta_centavos)}</span>
        </div>`).join('')}
      ${semVenc.map(v => `
        <div class="alertrow muted-alert" onclick="location.hash='#/cliente/${esc(v.cliente_slug)}'">
          <span>🟡 <b>${esc(v.cliente_nome)}</b> sem dia de vencimento definido</span>
          <span class="money">${centavosToBRL(v.falta_centavos)}</span>
        </div>`).join('')}
    </div>` : '';

  root.innerHTML = shell('dash', `
    <h2 class="section-title">Receita por mês</h2>
    <div class="card chart-card">${chartReceitaPorMes(dash.por_mes || [])}</div>

    <div class="kpis">
      <div class="kpi">
        <div class="label">Clientes ativos</div>
        <div class="value">${dash.clientes_ativos}</div>
      </div>
      <div class="kpi">
        <div class="label">Entrou este mês</div>
        <div class="value">${centavosToBRL(doMes.entrado_centavos)}</div>
      </div>
      <div class="kpi ${falta>0?'warn':''}">
        <div class="label">Falta este mês</div>
        <div class="value">${centavosToBRL(falta)}</div>
      </div>
      <div class="kpi ${vencidos.length?'bad':''}">
        <div class="label">Vencidos hoje/antes</div>
        <div class="value">${vencidos.length}</div>
      </div>
    </div>

    ${velocimetroMEI(dash.velocimetro_mei || {})}

    <div class="kpis" style="margin-top:14px;">
      <div class="kpi">
        <div class="label">Custos fixos — negócio</div>
        <div class="value">${centavosToBRL(dash.custos_fixos?.negocio_centavos)}</div>
      </div>
      <div class="kpi">
        <div class="label">Custos fixos — pessoal</div>
        <div class="value">${centavosToBRL(dash.custos_fixos?.pessoal_centavos)}</div>
      </div>
    </div>

    ${alertHtml}
  `);
}

// ============================================================
// CARTEIRA
// ============================================================
function kpisCarteira(rows){
  const recorrentes = rows.filter(r => r.valor_mensal_centavos != null);
  const totalMensal = recorrentes.reduce((s,r) => s + Number(r.valor_mensal_centavos), 0);
  const semVencimento = rows.filter(r => !r.tem_vencimento).length;
  const semContrato = rows.filter(r => !r.tem_contrato).length;
  return `
  <div class="kpis">
    <div class="kpi"><div class="label">Clientes ativos</div><div class="value">${rows.length}</div></div>
    <div class="kpi"><div class="label">Recorrente mensal</div><div class="value">${centavosToBRL(totalMensal)}</div></div>
    <div class="kpi ${semVencimento ? 'bad' : ''}"><div class="label">Sem dia de vencimento</div><div class="value">${semVencimento}</div></div>
    <div class="kpi ${semContrato ? 'warn' : ''}"><div class="label">Sem contrato formal</div><div class="value">${semContrato}</div></div>
  </div>`;
}

async function renderCarteira(){
  root.innerHTML = shell('carteira', `<div class="empty"><div class="spinner" style="margin:0 auto;"></div></div>`);
  carteira = await rpc('hub_rpc_carteira').catch(()=>[]);

  const rowsHtml = carteira.map(c => `
    <tr onclick="location.hash='#/cliente/${esc(c.slug)}'">
      <td data-label="Cliente"><b>${esc(c.nome)}</b></td>
      <td data-label="Serviço" class="muted">${esc(c.servico || '—')}</td>
      <td data-label="Valor mensal" class="money">${centavosToBRL(c.valor_mensal_centavos)}</td>
      <td data-label="Vencimento">${c.tem_vencimento ? ('dia ' + c.dia_vencimento) : '<span class="flag">🔴 sem vencimento</span>'}</td>
      <td data-label="Contrato">
        <span class="badge ${contratoBadgeClass(c.contrato_status)}">${statusLabel(c.contrato_status)}</span>
        ${!c.tem_contrato ? '<span class="flag">🔴 sem contrato</span>' : ''}
      </td>
    </tr>
  `).join('');

  root.innerHTML = shell('carteira', `
    <div class="row-between" style="margin-bottom:14px;">
      <h2 class="section-title" style="margin:0;">Carteira</h2>
      <button class="btn btn-primary btn-sm" onclick="abrirNovoCliente()">+ Novo cliente</button>
    </div>
    ${kpisCarteira(carteira)}
    <div class="tablewrap">
      <table>
        <thead><tr><th>Cliente</th><th>Serviço</th><th>Valor mensal</th><th>Vencimento</th><th>Contrato</th></tr></thead>
        <tbody>${rowsHtml || `<tr><td colspan="5" class="empty">Nenhum cliente cadastrado ainda.</td></tr>`}</tbody>
      </table>
    </div>
  `);
}

async function abrirNovoCliente(){
  const empresas = await rpc('hub_rpc_empresas').catch(()=>[]);
  const empresaId = empresas[0]?.id || '';
  openModal('Novo cliente', `
    <form onsubmit="return salvarCliente(event)">
      <input type="hidden" id="f-empresa-id" value="${esc(empresaId)}">
      <div class="field"><label>Nome</label><input id="f-nome" required oninput="document.getElementById('f-slug').value = slugify(this.value)"></div>
      <div class="field"><label>Slug (identificador único)</label><input id="f-slug" required></div>
      <div class="field"><label>Segmento</label><input id="f-segmento" placeholder="ex: Restaurante, Tráfego..."></div>
      <div class="field"><label>Status</label>
        <select id="f-status">
          <option value="prospect">Prospect</option>
          <option value="ativo" selected>Ativo</option>
          <option value="pausado">Pausado</option>
        </select>
      </div>
      <div class="field"><label>Observação</label><textarea id="f-observacao" rows="2"></textarea></div>
      <div class="row" style="justify-content:flex-end;margin-top:16px;">
        <button type="button" class="btn btn-outline" onclick="closeModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar</button>
      </div>
    </form>`);
}
async function salvarCliente(ev){
  ev.preventDefault();
  try{
    await rpc('hub_rpc_salvar_cliente', { p: {
      empresa_id: document.getElementById('f-empresa-id').value,
      nome: document.getElementById('f-nome').value,
      slug: document.getElementById('f-slug').value,
      segmento: document.getElementById('f-segmento').value || null,
      status: document.getElementById('f-status').value,
      observacao: document.getElementById('f-observacao').value || null,
    }});
    closeModal(); toast('Cliente salvo.'); carteira = []; renderCarteira();
  } catch(e){}
  return false;
}

// ============================================================
// CATÁLOGO
// ============================================================
async function renderCatalogo(){
  root.innerHTML = shell('catalogo', `<div class="empty"><div class="spinner" style="margin:0 auto;"></div></div>`);
  const catalogo = await rpc('hub_rpc_catalogo').catch(()=>[]);
  window.__catalogo = catalogo;

  const rowsHtml = catalogo.map((s,i) => `
    <tr onclick="abrirEditarServico(${i})">
      <td data-label="Serviço"><b>${esc(s.nome)}</b>${s.observacao ? `<div class="muted" style="font-size:12px;margin-top:2px;">${esc(s.observacao)}</div>` : ''}</td>
      <td data-label="Modalidade" class="muted">${esc(s.modalidade)}</td>
      <td data-label="Preço" class="money">${s.preco_referencia_centavos != null ? centavosToBRL(s.preco_referencia_centavos) + (s.unidade ? '/' + esc(s.unidade) : '') : 'negociado'}</td>
      <td data-label="Status">${s.ativo ? '<span class="badge badge-ok">Ativo</span>' : '<span class="badge badge-muted">Inativo</span>'}</td>
    </tr>
  `).join('');

  root.innerHTML = shell('catalogo', `
    <div class="row-between" style="margin-bottom:14px;">
      <h2 class="section-title" style="margin:0;">Catálogo de serviços</h2>
      <button class="btn btn-primary btn-sm" onclick="abrirNovoServico()">+ Novo serviço</button>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Serviço</th><th>Modalidade</th><th>Preço de tabela</th><th></th></tr></thead>
        <tbody>${rowsHtml || `<tr><td colspan="4" class="empty">Nenhum serviço cadastrado ainda.</td></tr>`}</tbody>
      </table>
    </div>
  `);
}

function formServico(s){
  s = s || {};
  return `
    <form onsubmit="return salvarServico(event)">
      <input type="hidden" id="f-id" value="${esc(s.id||'')}">
      <div class="field"><label>Nome</label><input id="f-nome" required value="${esc(s.nome||'')}"></div>
      <div class="field"><label>Slug</label><input id="f-slug" required value="${esc(s.slug||'')}"></div>
      <div class="field"><label>Modalidade</label>
        <select id="f-modalidade">
          ${['recorrente','projeto','bloco_horas','por_evento','hospedagem'].map(m =>
            `<option value="${m}" ${s.modalidade===m?'selected':''}>${m}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Preço de referência (R$, deixe vazio se negociado)</label>
        <input id="f-preco" type="number" step="0.01" value="${centavosToInputValue(s.preco_referencia_centavos)}"></div>
      <div class="field"><label>Unidade</label><input id="f-unidade" value="${esc(s.unidade||'')}" placeholder="mês, hora..."></div>
      <div class="field"><label>Observação</label><textarea id="f-observacao" rows="2">${esc(s.observacao||'')}</textarea></div>
      <div class="checkrow" style="margin-bottom:12px;"><input type="checkbox" id="f-ativo" ${s.ativo!==false?'checked':''}> <label for="f-ativo">Ativo</label></div>
      <div class="row" style="justify-content:flex-end;margin-top:16px;">
        <button type="button" class="btn btn-outline" onclick="closeModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar</button>
      </div>
    </form>`;
}
function abrirNovoServico(){ openModal('Novo serviço', formServico()); }
function abrirEditarServico(i){ openModal('Editar serviço', formServico(window.__catalogo[i])); }
async function salvarServico(ev){
  ev.preventDefault();
  try{

let financeiroCompetencia = null;
let financeiroCache = [];

async function renderFinanceiro(){
  if(!financeiroCompetencia) financeiroCompetencia = todayISO().slice(0,7) + '-01';
  root.innerHTML = shell('financeiro', `<div class="empty"><div class="spinner" style="margin:0 auto;"></div></div>`);
  const rows = await rpc('hub_rpc_recebiveis', { p_competencia: financeiroCompetencia }).catch(()=>[]);
  financeiroCache = rows;

  const totalPrevisto = rows.reduce((s,r)=>s+Number(r.valor_centavos),0);
  const totalEntrada = rows.reduce((s,r)=>s+Number(r.entrada_centavos),0);

  const rowsHtml = rows.map((r,i) => `
    <tr>
      <td data-label="Cliente" onclick="location.hash='#/cliente/${esc(r.cliente_slug)}'" style="cursor:pointer;"><b>${esc(r.cliente_nome)}</b></td>
      <td data-label="Descrição" class="muted">${esc(r.descricao)}</td>
      <td data-label="Valor" class="money">${centavosToBRL(r.valor_centavos)}</td>
      <td data-label="Falta" class="money">${centavosToBRL(r.falta_centavos)}</td>
      <td data-label="Vencimento">${r.vence_em ? formatDateBR(r.vence_em) : '<span class="flag">🔴 sem venc.</span>'}</td>
      <td data-label="Status"><span class="badge ${contratoBadgeClass(r.status)}">${statusLabel(r.status)}</span></td>
      <td data-label="Ações" onclick="event.stopPropagation()">
        <div class="row" style="justify-content:flex-end;gap:6px;">
          ${r.falta_centavos>0 ? `<button class="btn btn-sm btn-primary" onclick="abrirMarcarPago(${i})">Marcar pago</button>` : ''}
          <button class="btn btn-sm btn-outline" onclick="abrirEditarRecebivel(${i})">Editar</button>
        </div>
      </td>
    </tr>
  `).join('');

  root.innerHTML = shell('financeiro', `
    <div class="row-between" style="margin-bottom:14px;flex-wrap:wrap;gap:10px;">
      <h2 class="section-title" style="margin:0;">Financeiro — ${monthLabel(financeiroCompetencia)}/${financeiroCompetencia.slice(0,4)}</h2>
      <button class="btn btn-primary btn-sm" onclick="abrirNovoRecebivel()">+ Novo recebível</button>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="label">Previsto</div><div class="value">${centavosToBRL(totalPrevisto)}</div></div>
      <div class="kpi"><div class="label">Entrou</div><div class="value">${centavosToBRL(totalEntrada)}</div></div>
      <div class="kpi ${totalPrevisto-totalEntrada>0?'warn':''}"><div class="label">Falta</div><div class="value">${centavosToBRL(totalPrevisto-totalEntrada)}</div></div>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Cliente</th><th>Descrição</th><th>Valor</th><th>Falta</th><th>Vencimento</th><th>Status</th><th></th></tr></thead>
        <tbody>${rowsHtml || `<tr><td colspan="7" class="empty">Nenhum recebível nesse mês.</td></tr>`}</tbody>
      </table>
    </div>
  `);
}

async function abrirMarcarPago(i){
  const r = financeiroCache[i];
  openModal(`Marcar pago — ${esc(r.cliente_nome)}`, `
    <form onsubmit="return confirmarPagamento(event, '${r.id}')">
      <p class="muted" style="margin-top:0;">Falta: <b>${centavosToBRL(r.falta_centavos)}</b></p>
      <div class="field"><label>Valor recebido (R$)</label>
        <input id="f-valor" type="number" step="0.01" required value="${centavosToInputValue(r.falta_centavos)}"></div>
      <div class="field"><label>Data</label><input id="f-data" type="date" required value="${todayISO()}"></div>
      <div class="row" style="justify-content:flex-end;margin-top:16px;">
        <button type="button" class="btn btn-outline" onclick="closeModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary">Confirmar</button>
      </div>
    </form>`);
}
async function confirmarPagamento(ev, id){
  ev.preventDefault();
  try{
    const valor = brlInputToCentavos(document.getElementById('f-valor').value);
    const data = document.getElementById('f-data').value;
    await rpc('hub_rpc_marcar_pago', { p_id: id, p_valor_centavos: valor, p_data: data });
    closeModal(); toast('Pagamento registrado.'); renderFinanceiro();
  } catch(e){}
  return false;
}

  r = r || {};
  const opts = carteira.map(c => `<option value="${esc(c.cliente_id)}" ${r.cliente_id===c.cliente_id?'selected':''}>${esc(c.nome)}</option>`).join('');

      <div class="field"><label>Vence em</label><input id="f-vence" type="date" value="${r.vence_em||''}"></div>
      <div class="field"><label>Origem</label>

function abrirEditarRecebivel(i){ openModal('Editar recebível', formRecebivel(financeiroCache[i])); }
async function salvarRecebivel(ev){
  ev.preventDefault();
  try{
    await rpc('hub_rpc_salvar_recebivel', { p: {

let custosCache = [];
async function renderCustos(){
  root.innerHTML = shell('custos', `<div class="empty"><div class="spinner" style="margin:0 auto;"></div></div>`);
  custosCache = await rpc('hub_rpc_custos').catch(()=>[]);

  const total = custosCache.filter(c=>c.ativo).reduce((s,c)=>s+Number(c.valor_centavos),0);
  const negocio = custosCache.filter(c=>c.ativo && c.categoria==='negocio').reduce((s,c)=>s+Number(c.valor_centavos),0);

  const rowsHtml = custosCache.map((c,i) => `
    <tr onclick="abrirEditarCusto(${i})">
      <td data-label="Nome"><b>${esc(c.nome)}</b>${c.funcao?`<div class="muted" style="font-size:12px;">${esc(c.funcao)}</div>`:''}</td>
      <td data-label="Categoria"><span class="badge ${c.categoria==='negocio'?'badge-ok':'badge-muted'}">${c.categoria}</span></td>
      <td data-label="Valor" class="money">${centavosToBRL(c.valor_centavos)}</td>
      <td data-label="Vencimento">${c.dia_vencimento ? 'dia '+c.dia_vencimento : '—'}</td>
      <td data-label="Status">${c.ativo ? '<span class="badge badge-ok">Ativo</span>' : '<span class="badge badge-muted">Inativo</span>'}</td>
    </tr>
  `).join('');

  root.innerHTML = shell('custos', `
    <div class="row-between" style="margin-bottom:14px;">
      <h2 class="section-title" style="margin:0;">Custos fixos</h2>
      <button class="btn btn-primary btn-sm" onclick="abrirNovoCusto()">+ Novo custo</button>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="label">Total ativo</div><div class="value">${centavosToBRL(total)}</div></div>
      <div class="kpi"><div class="label">Negócio</div><div class="value">${centavosToBRL(negocio)}</div></div>
      <div class="kpi"><div class="label">Pessoal</div><div class="value">${centavosToBRL(total-negocio)}</div></div>
    </div>

      <table>
        <thead><tr><th>Nome</th><th>Categoria</th><th>Valor</th><th>Vencimento</th><th>Status</th></tr></thead>
        <tbody>${rowsHtml || `<tr><td colspan="5" class="empty">Nenhum custo cadastrado.</td></tr>`}</tbody>
      </table>
    </div>
  `);
}

function formCusto(c){

    <form onsubmit="return salvarCusto(event)">

          <option value="pessoal" ${c.categoria!=='negocio'?'selected':''}>Pessoal</option>
        </select>
      </div>
      <div class="field"><label>Valor mensal (R$)</label><input id="f-valor" type="number" step="0.01" required value="${centavosToInputValue(c.valor_centavos)}"></div>
      <div class="field"><label>Dia de vencimento (opcional)</label><input id="f-dia" type="number" min="1" max="31" value="${c.dia_vencimento||''}"></div>

function abrirNovoCusto(){ openModal('Novo custo fixo', formCusto()); }
function abrirEditarCusto(i){ openModal('Editar custo fixo', formCusto(custosCache[i])); }
async function salvarCusto(ev){
  ev.preventDefault();
  try{
    await rpc('hub_rpc_salvar_custo', { p: {
      id: document.getElementById('f-id').value || undefined,
      nome: document.getElementById('f-nome').value,
      funcao: document.getElementById('f-funcao').value || null,
      categoria: document.getElementById('f-categoria').value,
      valor_centavos: brlInputToCentavos(document.getElementById('f-valor').value),

  return false;
}

// FICHA DO CLIENTE (abas por pilar)
// ============================================================
let clienteAtual = null;
let pilarAtivo = 'financeiro';

async function renderCliente(slug){
  root.innerHTML = shell('carteira', `<div class="empty"><div class="spinner" style="margin:0 auto;"></div></div>`);
  const data = await rpc('hub_rpc_cliente', { p_slug: slug }).catch(()=>null);
  if(!data){ root.innerHTML = shell('carteira', `<div class="empty">Cliente não encontrado.</div>`); return; }
  clienteAtual = data;
  pilarAtivo = 'financeiro';
  desenharFichaCliente();
}

function desenharFichaCliente(){
  const data = clienteAtual;
  const c = data.cliente;

  root.innerHTML = shell('carteira', `
    <div style="margin-bottom:18px;">
      <a href="#/carteira" class="muted" style="text-decoration:none;font-size:13px;">← voltar pra carteira</a>
    </div>
    <div class="row-between" style="align-items:flex-start;margin-bottom:6px;flex-wrap:wrap;gap:10px;">
      <div>
        <h1 style="margin:0 0 4px;font-size:24px;">${esc(c.nome)}</h1>
        <span class="badge ${c.status==='ativo'?'badge-ok':'badge-muted'}">${statusLabel(c.status)}</span>
        ${c.segmento ? `<span class="muted" style="margin-left:8px;">${esc(c.segmento)}</span>` : ''}
      </div>
      <button class="btn btn-outline btn-sm" onclick="abrirEditarClienteFicha()">Editar cliente</button>
    </div>
    ${c.observacao ? `<div class="card" style="margin:14px 0;"><span class="muted">${esc(c.observacao)}</span></div>` : ''}

    <div class="pilartabs">
      <div class="pilartab ${pilarAtivo==='financeiro'?'active':''}" onclick="trocarPilar('financeiro', event)">Financeiro</div>
      <div class="pilartab ${pilarAtivo==='marketing'?'active':''}" onclick="trocarPilar('marketing', event)">Marketing</div>
      <div class="pilartab ${pilarAtivo==='comercial'?'active':''}" onclick="trocarPilar('comercial', event)">Comercial</div>
    </div>
    <div id="pilar-body">${renderPilar()}</div>
  `);
}
function trocarPilar(p, ev){
  pilarAtivo = p;
  document.getElementById('pilar-body').innerHTML = renderPilar();
  document.querySelectorAll('.pilartab').forEach(el=>el.classList.remove('active'));
  if(ev && ev.target) ev.target.classList.add('active');
}

function renderPilar(){
  if(pilarAtivo === 'marketing') return `<div class="pilar-empty">Em construção — próxima fase do hub.</div>`;
  if(pilarAtivo === 'comercial') return `<div class="pilar-empty">Em construção — próxima fase do hub.</div>`;
  return renderPilarFinanceiro();
}

function renderPilarFinanceiro(){
  const data = clienteAtual;
  const contatos = data.contatos || [];
  const contratos = data.contratos || [];

  const contatosHtml = contatos.length ? contatos.map((ct,i) => `
    <div class="row-between" style="padding:9px 0;border-top:1px solid var(--line);">
      <div><b>${esc(ct.nome)}</b> <span class="muted">${esc(ct.papel||'')}</span>
        <div class="muted" style="font-size:12px;">${esc(ct.whatsapp_e164 || '')} ${ct.email?'· '+esc(ct.email):''}</div>
      </div>
      <div class="row">
        ${ct.is_principal ? '<span class="badge badge-ok">Principal</span>' : ''}
        <button class="btn btn-sm btn-outline" onclick="abrirEditarContato(${i})">Editar</button>
      </div>
    </div>`).join('') : `<div class="muted">Nenhum contato cadastrado.</div>`;

  const contratosHtml = contratos.length ? contratos.map((item,i) => {
    const co = item.contrato;
    const itens = item.itens || [];
    return `
    <div class="card" style="margin-bottom:12px;">
      <div class="row-between" style="flex-wrap:wrap;gap:8px;">
        <div>
          <span class="badge ${contratoBadgeClass(co.status)}">${statusLabel(co.status)}</span>
          ${co.numero ? `<span class="muted" style="margin-left:8px;">nº ${esc(co.numero)}</span>` : ''}
        </div>
        <div class="row">
          <div class="money">${centavosToBRL(co.valor_mensal_centavos)}${co.dia_vencimento ? ' · dia '+co.dia_vencimento : ''}</div>
          <button class="btn btn-sm btn-outline" onclick="abrirEditarContrato(${i})">Editar</button>
        </div>
      </div>
      ${itens.length ? `<ul style="margin:12px 0 0;padding-left:18px;color:var(--muted);font-size:13px;">
        ${itens.map(it => `<li>${esc(it.descricao)} — ${centavosToBRL(it.valor_centavos)}</li>`).join('')}
      </ul>` : ''}
      ${co.porta_saida_escrita_em
        ? `<div class="muted" style="margin-top:10px;font-size:12.5px;">✓ Porta de saída escrita (${esc(co.porta_saida_tipo || 'nenhuma')})</div>`
        : `<div class="flag" style="margin-top:10px;">🔴 sem porta de saída escrita</div>`}
      ${co.observacao ? `<div class="muted" style="margin-top:8px;font-size:12.5px;">${esc(co.observacao)}</div>` : ''}
    </div>`;
  }).join('') : `<div class="muted">Nenhum contrato registrado.</div>`;

  return `
    <div class="row-between" style="margin-bottom:12px;">
      <h2 class="section-title" style="margin:0;">Contratos</h2>
      <button class="btn btn-sm btn-outline" onclick="abrirNovoContrato()">+ Novo contrato</button>
    </div>
    ${contratosHtml}

    <div class="row-between" style="margin-top:28px;margin-bottom:12px;">
      <h2 class="section-title" style="margin:0;">Contatos</h2>
      <button class="btn btn-sm btn-outline" onclick="abrirNovoContato()">+ Novo contato</button>
    </div>
    <div class="card">${contatosHtml}</div>`;
}

      <div class="field"><label>Observação</label><textarea id="f-observacao" rows="2">${esc(co.observacao||'')}</textarea></div>
      <p class="muted" style="font-size:12px;">🔒 O banco recusa deixar o contrato "Ativo" sem a porta de saída marcada.</p>
      <div class="row" style="justify-content:flex-end;margin-top:16px;">
        <button type="button" class="btn btn-outline" onclick="closeModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar</button>
      </div>
    </form>`;
}
async function salvarContrato(ev){
  ev.preventDefault();
  try{
    const portaEscrita = document.getElementById('f-porta-escrita').checked;
    await rpc('hub_rpc_salvar_contrato', { p: {
      id: document.getElementById('f-id').value || undefined,
      cliente_id: document.getElementById('f-cliente-id').value,
      numero: document.getElementById('f-numero').value || null,
      status: document.getElementById('f-status').value,
      valor_mensal_centavos: brlInputToCentavos(document.getElementById('f-valor').value),
      dia_vencimento: document.getElementById('f-dia').value || null,
      inicio_em: document.getElementById('f-inicio').value || null,
      fim_minimo_em: document.getElementById('f-fim').value || null,
      porta_saida_tipo: document.getElementById('f-porta-tipo').value || null,
      porta_saida_escrita_em: portaEscrita ? new Date().toISOString() : null,
      observacao: document.getElementById('f-observacao').value || null,
    }});
    closeModal(); toast('Contrato salvo.');
    const slug = clienteAtual.cliente.slug;
    renderCliente(slug);
  } catch(e){}
  return false;
}

// ---- contato ----
function abrirNovoContato(){ openModal('Novo contato', formContato({ cliente_id: clienteAtual.cliente.id })); }
function abrirEditarContato(i){ openModal('Editar contato', formContato(clienteAtual.contatos[i])); }
function formContato(ct){
  ct = ct || {};
  return `
    <form onsubmit="return salvarContato(event)">
      <input type="hidden" id="f-id" value="${esc(ct.id||'')}">
      <input type="hidden" id="f-cliente-id" value="${esc(ct.cliente_id||'')}">
      <div class="field"><label>Nome</label><input id="f-nome" required value="${esc(ct.nome||'')}"></div>
      <div class="field"><label>Papel</label><input id="f-papel" value="${esc(ct.papel||'')}" placeholder="dono, financeiro..."></div>
      <div class="field"><label>WhatsApp (formato 55DDDNÚMERO)</label><input id="f-whatsapp" value="${esc(ct.whatsapp_e164||'')}" placeholder="5584999998888"></div>
      <div class="field"><label>E-mail</label><input id="f-email" type="email" value="${esc(ct.email||'')}"></div>
      <div class="checkrow" style="margin-bottom:12px;"><input type="checkbox" id="f-principal" ${ct.is_principal?'checked':''}> <label for="f-principal">Contato principal</label></div>
      <div class="row" style="justify-content:flex-end;margin-top:16px;">
        <button type="button" class="btn btn-outline" onclick="closeModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar</button>
      </div>
    </form>`;
}
async function salvarContato(ev){
  ev.preventDefault();
  try{
    await rpc('hub_rpc_salvar_contato', { p: {
      id: document.getElementById('f-id').value || undefined,
      cliente_id: document.getElementById('f-cliente-id').value,
      nome: document.getElementById('f-nome').value,
      papel: document.getElementById('f-papel').value || null,
      whatsapp_e164: document.getElementById('f-whatsapp').value || null,
      email: document.getElementById('f-email').value || null,
      is_principal: document.getElementById('f-principal').checked,
    }});
    closeModal(); toast('Contato salvo.');
    renderCliente(clienteAtual.cliente.slug);
  } catch(e){}
  return false;
}

// ============================================================
// ROUTER
// ============================================================
async function render(){
  if(!session){ renderLogin(); return; }
  if((session.user.email||'').toLowerCase() !== HUB_ADMIN_EMAIL.toLowerCase()){ renderAcessoNegado(); return; }

  const { page, param } = currentRoute();
  if(page === 'cliente' && param) return renderCliente(param);
  if(page === 'carteira') return renderCarteira();
  if(page === 'catalogo') return renderCatalogo();
  if(page === 'financeiro') return renderFinanceiro();
  if(page === 'custos') return renderCustos();
  return renderDash();
}

init();
</script>
