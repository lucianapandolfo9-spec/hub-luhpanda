<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub Luh Panda</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

<div id="root">
  <div class="empty"><div class="spinner" style="margin:0 auto 12px;"></div>Carregando...</div>
</div>

<script src="config.js"></script>
<script>
const root = document.getElementById('root');
let session = null;
let carteira = [];
let catalogo = [];

// ---------- helpers ----------
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2800);
}
function centavosToBRL(c){
  if(c==null) return '—';
  return (c/100).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
}
function statusLabel(s){
  return {
    prospect:'Prospect', ativo:'Ativo', pausado:'Pausado', encerrado:'Encerrado',
    rascunho:'Rascunho', emitido:'Emitido', enviado:'Enviado', assinado:'Assinado', encerrado_c:'Encerrado'
  }[s] || s;
}
function contratoBadgeClass(status){
  if(status === 'ativo' || status === 'assinado') return 'badge-ok';
  if(status === 'rascunho') return 'badge-warn';
  return 'badge-muted';
}

// ---------- rota (hash) ----------
function currentRoute(){
  const h = location.hash.replace(/^#\/?/, '');
  const [page, ...rest] = h.split('/');
  return { page: page || 'carteira', param: rest.join('/') };
}
window.addEventListener('hashchange', render);

// ---------- AUTH ----------
async function init(){
  const { data } = await hubClient.auth.getSession();
  session = data.session;
  hubClient.auth.onAuthStateChange((_event, s) => {
    session = s;
    render();
  });
  render();
}

function renderLogin(){
  root.innerHTML = `
  <div class="topbar"><div class="brandmark"><span class="dot"></span> Hub <span class="muted">Luh Panda</span></div></div>
  <div class="login-box card">
    <h2 style="margin-top:0;">Entrar</h2>
    <p class="muted">Link mágico direto pro seu e-mail.</p>
    <div class="stack">
      <input type="email" id="login-email" placeholder="seu@email.com" value="${esc(HUB_ADMIN_EMAIL)}">
      <button class="btn btn-primary" onclick="doLogin()">Enviar link de acesso</button>
      <div id="login-msg" class="muted"></div>
    </div>
  </div>`;
}

async function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const msg = document.getElementById('login-msg');
  msg.textContent = 'Enviando...';
  const { error } = await hubClient.auth.signInWithOtp({
    email, options:{ emailRedirectTo: location.href.split('?')[0].split('#')[0] }
  });
  msg.textContent = error ? 'Erro ao enviar. Tenta de novo.' : 'Link enviado — confere seu e-mail.';
}

async function logout(){
  await hubClient.auth.signOut();
  render();
}

function renderAcessoNegado(){
  root.innerHTML = `
  <div class="topbar"><div class="brandmark"><span class="dot"></span> Hub <span class="muted">Luh Panda</span></div></div>
  <div class="wrap">
    <div class="card" style="max-width:480px;margin:60px auto;text-align:center;">
      <h2>Acesso negado</h2>
      <p class="muted">Esta sessão (${esc(session.user.email)}) não é a administradora do hub.</p>
      <button class="btn btn-outline" onclick="logout()">Sair</button>
    </div>
  </div>`;
}

// ---------- shell ----------
function shell(activePage, bodyHtml){
  const tabs = [
    ['carteira','Carteira'],
    ['catalogo','Catálogo'],
  ];
  return `
  <div class="topbar">
    <div class="row" style="gap:22px;">
      <div class="brandmark"><span class="dot"></span> Hub <span class="muted">Luh Panda</span></div>
      <div class="tabs">
        ${tabs.map(([p,l]) => `<div class="tab ${p===activePage?'active':''}" onclick="location.hash='#/${p}'">${l}</div>`).join('')}
      </div>
    </div>
    <div class="row">
      <span class="muted">${esc(session.user.email)}</span>
      <button class="btn btn-outline btn-sm" onclick="logout()">Sair</button>
    </div>
  </div>
  <div class="wrap">${bodyHtml}</div>`;
}

// ---------- CARTEIRA ----------
async function loadCarteira(){
  const { data, error } = await hubClient.rpc('hub_rpc_carteira');
  if(error){ toast('Erro ao carregar carteira: ' + error.message); return []; }
  return data || [];
}

function kpisCarteira(rows){
  const recorrentes = rows.filter(r => r.valor_mensal_centavos != null);
  const totalMensal = recorrentes.reduce((s,r) => s + Number(r.valor_mensal_centavos), 0);
  const semVencimento = rows.filter(r => !r.tem_vencimento).length;
  const semContrato = rows.filter(r => !r.tem_contrato).length;
  return `
  <div class="kpis">
    <div class="kpi">
      <div class="label">Clientes ativos</div>
      <div class="value">${rows.length}</div>
    </div>
    <div class="kpi">
      <div class="label">Recorrente mensal</div>
      <div class="value">${centavosToBRL(totalMensal)}</div>
    </div>
    <div class="kpi ${semVencimento ? 'bad' : ''}">
      <div class="label">Sem dia de vencimento</div>
      <div class="value">${semVencimento}</div>
    </div>
    <div class="kpi ${semContrato ? 'warn' : ''}">
      <div class="label">Sem contrato formal</div>
      <div class="value">${semContrato}</div>
    </div>
  </div>`;
}

async function renderCarteira(){
  root.innerHTML = shell('carteira', `<div class="empty"><div class="spinner" style="margin:0 auto;"></div></div>`);
  carteira = await loadCarteira();

  const rowsHtml = carteira.map(c => `
    <tr onclick="location.hash='#/cliente/${esc(c.slug)}'">
      <td><b>${esc(c.nome)}</b></td>
      <td class="muted">${esc(c.servico || '—')}</td>
      <td class="money">${centavosToBRL(c.valor_mensal_centavos)}</td>
      <td>${c.tem_vencimento ? ('dia ' + c.dia_vencimento) : '<span class="flag">🔴 sem vencimento</span>'}</td>
      <td>
        <span class="badge ${contratoBadgeClass(c.contrato_status)}">${statusLabel(c.contrato_status)}</span>
        ${!c.tem_contrato ? '<span class="flag">🔴 sem contrato</span>' : ''}
      </td>
    </tr>
  `).join('');

  root.innerHTML = shell('carteira', `
    <h2 class="section-title">Carteira</h2>
    ${kpisCarteira(carteira)}
    <div class="tablewrap">
      <table>
        <thead><tr><th>Cliente</th><th>Serviço</th><th>Valor mensal</th><th>Vencimento</th><th>Contrato</th></tr></thead>
        <tbody>${rowsHtml || `<tr><td colspan="5" class="empty">Nenhum cliente cadastrado ainda.</td></tr>`}</tbody>
      </table>
    </div>
  `);
}

// ---------- CATÁLOGO ----------
async function loadCatalogo(){
  const { data, error } = await hubClient.rpc('hub_rpc_catalogo');
  if(error){ toast('Erro ao carregar catálogo: ' + error.message); return []; }
  return data || [];
}

async function renderCatalogo(){
  root.innerHTML = shell('catalogo', `<div class="empty"><div class="spinner" style="margin:0 auto;"></div></div>`);
  catalogo = await loadCatalogo();

  const rowsHtml = catalogo.map(s => `
    <tr>
      <td><b>${esc(s.nome)}</b>${s.observacao ? `<div class="muted" style="font-size:12px;margin-top:2px;">${esc(s.observacao)}</div>` : ''}</td>
      <td class="muted">${esc(s.modalidade)}</td>
      <td class="money">${s.preco_referencia_centavos != null ? centavosToBRL(s.preco_referencia_centavos) + (s.unidade ? '/' + esc(s.unidade) : '') : 'negociado'}</td>
      <td>${s.ativo ? '<span class="badge badge-ok">Ativo</span>' : '<span class="badge badge-muted">Inativo</span>'}</td>
    </tr>
  `).join('');

  root.innerHTML = shell('catalogo', `
    <h2 class="section-title">Catálogo de serviços</h2>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Serviço</th><th>Modalidade</th><th>Preço de tabela</th><th></th></tr></thead>
        <tbody>${rowsHtml || `<tr><td colspan="4" class="empty">Nenhum serviço cadastrado ainda.</td></tr>`}</tbody>
      </table>
    </div>
  `);
}

// ---------- FICHA DO CLIENTE ----------
async function renderCliente(slug){
  root.innerHTML = shell('carteira', `<div class="empty"><div class="spinner" style="margin:0 auto;"></div></div>`);
  const { data, error } = await hubClient.rpc('hub_rpc_cliente', { p_slug: slug });
  if(error || !data){
    root.innerHTML = shell('carteira', `<div class="empty">Cliente não encontrado.</div>`);
    return;
  }

  const c = data.cliente;
  const contatos = data.contatos || [];
  const contratos = data.contratos || [];

  const contatosHtml = contatos.length ? contatos.map(ct => `
    <div class="row" style="justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);">
      <div><b>${esc(ct.nome)}</b> <span class="muted">${esc(ct.papel||'')}</span></div>
      <div class="muted">${esc(ct.whatsapp_e164 || ct.email || '')}</div>
    </div>`).join('') : `<div class="muted">Nenhum contato cadastrado.</div>`;

  const contratosHtml = contratos.length ? contratos.map(item => {
    const co = item.contrato;
    const itens = item.itens || [];
    return `
    <div class="card" style="margin-bottom:12px;">
      <div class="row-between">
        <div>
          <span class="badge ${contratoBadgeClass(co.status)}">${statusLabel(co.status)}</span>
          ${co.numero ? `<span class="muted" style="margin-left:8px;">nº ${esc(co.numero)}</span>` : ''}
        </div>
        <div class="money">${centavosToBRL(co.valor_mensal_centavos)}${co.dia_vencimento ? ' · dia '+co.dia_vencimento : ''}</div>
      </div>
      ${itens.length ? `<ul style="margin:12px 0 0;padding-left:18px;color:var(--muted);font-size:13px;">
        ${itens.map(it => `<li>${esc(it.descricao)} — ${centavosToBRL(it.valor_centavos)}</li>`).join('')}
      </ul>` : ''}
      ${co.porta_saida_escrita_em
        ? `<div class="muted" style="margin-top:10px;font-size:12.5px;">✓ Porta de saída escrita (${esc(co.porta_saida_tipo || 'nenhuma')})</div>`
        : `<div class="flag" style="margin-top:10px;">🔴 sem porta de saída escrita</div>`}
      ${co.observacao ? `<div class="muted" style="margin-top:8px;font-size:12.5px;">${esc(co.observacao)}</div>` : ''}
    </div>`;
  }).join('') : `<div class="muted">Nenhum contrato registrado.</div>`;

  root.innerHTML = shell('carteira', `
    <div style="margin-bottom:18px;">
      <a href="#/carteira" class="muted" style="text-decoration:none;font-size:13px;">← voltar pra carteira</a>
    </div>
    <div class="row-between" style="align-items:flex-start;margin-bottom:20px;">
      <div>
        <h1 style="margin:0 0 4px;font-size:24px;">${esc(c.nome)}</h1>
        <span class="badge ${c.status==='ativo'?'badge-ok':'badge-muted'}">${statusLabel(c.status)}</span>
        ${c.segmento ? `<span class="muted" style="margin-left:8px;">${esc(c.segmento)}</span>` : ''}
      </div>
    </div>
    ${c.observacao ? `<div class="card" style="margin-bottom:20px;"><span class="muted">${esc(c.observacao)}</span></div>` : ''}

    <h2 class="section-title">Contratos</h2>
    ${contratosHtml}

    <h2 class="section-title" style="margin-top:28px;">Contatos</h2>
    <div class="card">${contatosHtml}</div>
  `);
}

// ---------- router ----------
async function render(){
  if(!session){ renderLogin(); return; }
  if((session.user.email||'').toLowerCase() !== HUB_ADMIN_EMAIL.toLowerCase()){ renderAcessoNegado(); return; }

  const { page, param } = currentRoute();
  if(page === 'cliente' && param) return renderCliente(param);
  if(page === 'catalogo') return renderCatalogo();
  return renderCarteira();
}

init();
</script>
</body>
</html>
