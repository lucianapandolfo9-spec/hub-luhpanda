    </form>`;
}
function abrirNovoProspect(){ openModal('Novo prospect', formProspect()); }
function abrirEditarProspect(){ openModal('Editar prospect', formProspect(prospectAtual)); }
async function salvarProspect(ev){
  ev.preventDefault();
  const id = document.getElementById('f-id').value || undefined;
  try{
    const novoId = await rpc('hub_rpc_salvar_prospect', { p: {
      id,
      nome: document.getElementById('f-nome').value,
      origem: document.getElementById('f-origem').value || null,
      contato_whatsapp: document.getElementById('f-whatsapp').value || null,
      contato_eh_grupo: document.getElementById('f-tipo-contato').value === 'grupo',
      contato_email: document.getElementById('f-email').value || null,
      coluna: parseInt(document.getElementById('f-coluna').value, 10),
      valor_estimado_centavos: brlInputToCentavos(document.getElementById('f-valor').value),
      gravacao: document.getElementById('f-gravacao').checked,
      nota: document.getElementById('f-nota').value || null,
      // passthrough — upsert sobrescreve tudo, mesma lição do cliente (Bloco 1.5)
      perdido: prospectAtual && prospectAtual.id===id ? prospectAtual.perdido : false,
      motivo_perda: prospectAtual && prospectAtual.id===id ? prospectAtual.motivo_perda : null,
      fechado_em: prospectAtual && prospectAtual.id===id ? prospectAtual.fechado_em : null,
      entrou_em: prospectAtual && prospectAtual.id===id ? prospectAtual.entrou_em : undefined,
    }});
    closeModal(); toast('Prospect salvo.');
    prospectsCache = [];
    if(id){ renderProspect(id); } else { location.hash = '#/prospect/' + novoId; }
  } catch(e){}
  return false;
}

async function renderProspect(id){
  root.innerHTML = shell('crm', `<div class="empty"><div class="spinner" style="margin:0 auto;"></div></div>`);
  const p = await rpc('hub_rpc_prospect', { p_id: id }).catch(()=>null);
  if(!p){ root.innerHTML = shell('crm', `<div class="empty">Prospect não encontrado.</div>`); return; }
  prospectAtual = p;
  desenharProspect();
}

function desenharProspect(){
  const p = prospectAtual;
  const steps = ONBOARD.map((t,i)=>{
    const done = i <= p.coluna, now = i === p.coluna + 1 && !p.perdido;
    let acao = '';
    if(now){
      const rotulo = i===2?'Precificar':i===3?'Gerar PDF do orçamento':i===4?'Enviar via WhatsApp':i===5?'Emitir contrato':'Avançar';
      const dica = i===5 ? "toast('Emitir contrato entra no próximo bloco (Contratos).')" : 'avancarEtapaProspect()';
      acao = `<div class="step-act"><button class="btn btn-sm btn-primary" onclick="${dica}">${rotulo}</button></div>`;
    }
    return `<div class="step ${done?'done':''} ${now?'now':''}">
      <div class="step-dot">${done?'✓':i+1}</div>
      <div class="step-body">
        <div class="step-title">${esc(t)}</div>
        ${i===1 && p.gravacao ? '<div class="step-sub">gravação no Meetily — sync automático entra em fase futura</div>' : ''}
        ${i===2 && p.valor_estimado_centavos ? `<div class="step-sub">valor estimado: ${centavosToBRL(p.valor_estimado_centavos)}</div>` : ''}
        ${acao}
      </div>
    </div>`;
  }).join('');

  root.innerHTML = shell('crm', `
    <span class="back" onclick="location.hash='#/crm'">← voltar pro CRM</span>
    <div class="row-between" style="align-items:flex-start;margin-bottom:6px;flex-wrap:wrap;gap:10px;">
      <div>
        <h1 style="margin:0 0 4px;font-size:24px;">${esc(p.nome)}</h1>
        <span class="badge ${p.perdido?'badge-bad':'badge-muted'}">${p.perdido?'Perdido':esc(KCOLS[p.coluna])}</span>
        ${p.origem ? `<span class="muted" style="margin-left:8px;">${esc(p.origem)}</span>` : ''}
      </div>
      <div class="row" style="gap:8px;flex-wrap:wrap;">
        ${!p.perdido && p.coluna>0 ? `<button class="btn btn-outline btn-sm" onclick="voltarEtapaProspect()">Voltar etapa</button>` : ''}
        ${!p.perdido && p.coluna<5 ? `<button class="btn btn-outline btn-sm" onclick="avancarEtapaProspect()">Avançar etapa</button>` : ''}
        ${!p.perdido && p.coluna===5 ? `<button class="btn btn-primary btn-sm" onclick="abrirConverterProspect()">Converter em cliente</button>` : ''}
        <button class="btn btn-outline btn-sm" onclick="abrirEditarProspect()">Editar</button>
        ${p.perdido
          ? `<button class="btn btn-outline btn-sm" onclick="confirmarReabrirProspect()">Reabrir</button>`
          : `<button class="btn btn-danger btn-sm" onclick="abrirMarcarPerdidoProspect()">Marcar como perdido</button>`}
        <button class="btn btn-danger btn-sm" onclick="abrirApagarProspect()">Apagar</button>
      </div>
    </div>
    ${p.perdido ? `<div class="card" style="margin:14px 0;border-color:rgba(255,92,122,.35);"><span class="muted">Perdido${p.motivo_perda?': '+esc(p.motivo_perda):''}. Nada foi apagado — dá pra reabrir quando quiser.</span></div>` : ''}
    <div class="grid2">
      <div class="card">
        <p class="eyebrow" style="color:var(--fraco)">Onboarding</p>
        <div class="steps">${steps}</div>
      </div>
      <div>
        <div class="card" style="margin-bottom:14px;">
          <p class="eyebrow" style="color:var(--fraco)">Resumo</p>
          <p class="muted" style="margin:0;font-size:13.5px;">${esc(p.nota || 'Sem nota.')}</p>
          <div class="row" style="margin-top:12px;flex-wrap:wrap;">
            ${p.valor_estimado_centavos ? `<span class="badge badge-roxo">${centavosToBRL(p.valor_estimado_centavos)}</span>` : ''}
            ${p.gravacao ? '<span class="badge badge-roxo">🎥 Meetily</span>' : ''}
            <span class="badge badge-muted">${formatDateBR(p.entrou_em)}</span>
          </div>
        </div>
        <div class="card" style="margin-bottom:14px;">
          <p class="eyebrow" style="color:var(--fraco)">Contato</p>
          <div class="muted" style="font-size:13px;">${p.contato_whatsapp ? (p.contato_eh_grupo ? '👥 grupo — ' : '') + esc(p.contato_whatsapp) : 'sem WhatsApp'}${p.contato_email ? ' · '+esc(p.contato_email) : ''}</div>
        </div>
        <div class="card">
          <p class="eyebrow" style="color:var(--fraco)">Conversa</p>
          ${renderConversa(p.contato_whatsapp, {
            prospect_id: p.id,
            eh_grupo: p.contato_eh_grupo,
            semFone: 'Sem WhatsApp cadastrado — preencha em "Editar" pra conversar por aqui.',
          })}
        </div>
      </div>
    </div>
  `);
}

async function avancarEtapaProspect(){
  const p = prospectAtual;
  if(p.coluna >= 5) return;
  try{
    await rpc('hub_rpc_salvar_prospect', { p: {
      id: p.id, nome: p.nome, origem: p.origem, contato_whatsapp: p.contato_whatsapp,
      contato_email: p.contato_email, coluna: p.coluna + 1,
      valor_estimado_centavos: p.valor_estimado_centavos, gravacao: p.gravacao, nota: p.nota,
      entrou_em: p.entrou_em, perdido: false, motivo_perda: null, fechado_em: p.fechado_em,
    }});
    toast('Avançou pra "' + KCOLS[p.coluna+1] + '".');
    prospectsCache = [];
    renderProspect(p.id);
  } catch(e){}
}
async function voltarEtapaProspect(){
  const p = prospectAtual;
  if(p.coluna <= 0) return;
  try{
    await rpc('hub_rpc_salvar_prospect', { p: {
      id: p.id, nome: p.nome, origem: p.origem, contato_whatsapp: p.contato_whatsapp,

// Campo que falta NUNCA some em silêncio nem é chutado — aparece no PDF.
const CT_VAZIO = '[A PREENCHER]';

// ---------- número por extenso (pt-BR) ----------
// Determinístico, sem IA. Cobre até bilhões, que é muito além do necessário.
const _EXT_U = ['zero','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez',
  'onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
const _EXT_D = ['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
const _EXT_C = ['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];

function _extAte999(n){
  if(n === 100) return 'cem';                       // 100 é "cem", 101+ é "cento e ..."
  const partes = [];
  const c = Math.floor(n / 100), r = n % 100;
  if(c) partes.push(_EXT_C[c]);
  if(r < 20){ if(r) partes.push(_EXT_U[r]); }
  else {
    const d = Math.floor(r / 10), u = r % 10;
    partes.push(u ? _EXT_D[d] + ' e ' + _EXT_U[u] : _EXT_D[d]);
  }
  return partes.join(' e ');
}
function numeroPorExtenso(n){
  n = Math.floor(Math.abs(Number(n) || 0));
  if(n === 0) return 'zero';
  const partes = [];
  let resto = n;
  [[1000000000,'bilhão','bilhões'], [1000000,'milhão','milhões'], [1000,'mil','mil']]
    .forEach(([base, sing, plur]) => {
      const q = Math.floor(resto / base);
      if(!q) return;
      partes.push(base === 1000
        ? (q === 1 ? 'mil' : _extAte999(q) + ' mil')
        : _extAte999(q) + ' ' + (q === 1 ? sing : plur));
      resto = resto % base;
    });
  if(resto) partes.push(_extAte999(resto));
  if(partes.length === 1) return partes[0];
  // regra pt-BR: " e " antes do último quando ele é < 100 ou centena redonda
  // ("mil e duzentos", "mil duzentos e cinquenta")
  // ("mil e duzentos", "mil novecentos e noventa e nove",
  //  "um milhão, duzentos e trinta e quatro mil quinhentos e sessenta e sete")
  const usaE = resto > 0 && (resto < 100 || resto % 100 === 0);
  return partes.slice(0, -1).join(', ') + (usaE ? ' e ' : ' ') + partes[partes.length - 1];
}
function valorPorExtenso(centavos){
  if(centavos == null) return CT_VAZIO;
  const total = Math.round(Number(centavos));
  const reais = Math.floor(total / 100), cents = total % 100;
  const nR = reais === 1 ? 'real' : 'reais';
  const nC = cents === 1 ? 'centavo' : 'centavos';
  if(reais && cents) return `${numeroPorExtenso(reais)} ${nR} e ${numeroPorExtenso(cents)} ${nC}`;
  if(cents) return `${numeroPorExtenso(cents)} ${nC}`;
  return `${numeroPorExtenso(reais)} ${nR}`;
}

function ctCampo(v){
  const s = (v == null ? '' : String(v)).trim();
  return s ? esc(s) : `<span class="ct-falta">${CT_VAZIO}</span>`;
}
function ctDataBR(iso){ return iso ? formatDateBR(iso) : null; }

function rascunhoAnexo(servico){
  const nome = (servico && servico.nome) || '';
  const bruto = ((servico && servico.inclui) || '').trim();
  const itens = bruto
    ? bruto.split(/\r?\n|·|;/).map(s => s.replace(/^[-–•\s]+/, '').trim()).filter(Boolean)
    : [];
  const inclui = itens.length
    ? itens.map(i => '- ' + i).join('\n')
    : '- [A PREENCHER] o que está incluído no serviço';
  return `**Serviço:** ${nome}

${inclui}

- Verbas, licenças e ferramentas de terceiros — pagas diretamente pela CONTRATANTE
- Produção de material bruto (fotos, vídeos, textos) não acordada acima
- Qualquer escopo não listado em "Inclui"

**Responsabilidades da CONTRATANTE**
- Dar os acessos necessários à execução do serviço
- Enviar material e aprovar entregas em até 48 horas
- Manter ativas as contas e formas de pagamento envolvidas

**Resultados**

volume de vendas, leads ou faturamento, que dependem também da oferta, do atendimento
da CONTRATANTE e de fatores fora do controle da CONTRATADA.`;
}

// Monta o contexto e decide se precisa pedir o Anexo I antes.
// Usado na ficha do cliente (tem clienteAtual) e na tela #/contratos
// (precisa buscar o cliente).
async function emitirContrato(contratoId, clienteSlug){
  let dados;
  if(clienteAtual && clienteAtual.cliente && clienteAtual.cliente.slug === clienteSlug){
    dados = clienteAtual;
  } else {
    dados = await rpc('hub_rpc_cliente', { p_slug: clienteSlug }).catch(()=>null);
  }
  if(!dados){ toast('Não achei a ficha desse cliente.'); return; }

  const item = (dados.contratos || []).find(x => x.contrato.id === contratoId);
  if(!item){ toast('Contrato não encontrado na ficha.'); return; }

  const catalogo = window.__catalogo && window.__catalogo.length
    ? window.__catalogo
    : await rpc('hub_rpc_catalogo').catch(()=>[]);
  window.__catalogo = catalogo;

  // o serviço do contrato vem dos itens; o anexo vem do serviço do catálogo
  const itens = item.itens || [];
  const servicoNome = itens.length
    ? [...new Set(itens.map(i => i.descricao))].join(' + ')
    : null;
  const servicoId = itens.map(i => i.servico_id).find(Boolean) || null;
  const servico = servicoId ? catalogo.find(s => s.id === servicoId) : null;

  const ctx = {
    contrato: item.contrato,
    cliente: dados.cliente,
    servicoNome,
    anexoTexto: servico ? servico.anexo_escopo : null,
  };

  // Primeira vez com esse serviço: abre o Anexo I já com um rascunho pronto,
  // ela revisa e salva, e aí o contrato sai. Não bloqueia — se não houver
  // serviço amarrado, dá pra seguir e o anexo entra como [A PREENCHER].
  if(servico && !(servico.anexo_escopo || '').trim()){
    abrirAnexoServico(servico, ctx);
    return;
  }
  gerarContratoPDF(ctx);
}

async function salvarAnexoEEmitir(){
  if(!anexoPendente) return;

// não em hub.rpc_status_contrato, que é genérica de propósito (o botão
// "Enviar" também usa) e não deve carregar regra de ordem escondida: um dia
// ela pode querer corrigir manualmente pra trás, e a RPC tem que deixar.
const CT_PIPELINE = ['rascunho','emitido','enviado','assinado','ativo','encerrado'];

// 🔴 Bug real de produção (24/09/2026): o checkbox vinha marcado por padrão e
// chamava rpc_status_contrato('assinado') incondicionalmente — rebaixou F7,
// Império Ruby e Dobradinha de 'ativo' pra 'assinado' ao subir o PDF deles
// (que já estava assinado havia dias). Dado corrigido na hora pelo
// coordenador; aqui é o conserto de código: o checkbox só AVANÇA o status,
// nunca rebaixa. Contrato já em 'ativo'/'encerrado' faz upload normal, mas
// marcar o checkbox vira no-op de status — só sobe o arquivo.
function statusPodeAvancarPraAssinado(statusAtual){
  const i = CT_PIPELINE.indexOf(statusAtual);
  // status desconhecido/vazio (ex: campo não carregou) NÃO avança — o risco
  // de rebaixar por engano em cima de um valor que não deu pra confirmar é
  // pior do que deixar de marcar "assinado" numa vez. Só avança quando o
  // status É um dos 6 valores válidos e está estritamente antes de 'assinado'.
  if(i === -1) return false;
  return i < CT_PIPELINE.indexOf('assinado');
}

function abrirSubirContrato(contratoId, clienteSlug, statusAtual, temArquivo){
  const podeAvancar = statusPodeAvancarPraAssinado(statusAtual);
  openModal('PDF do contrato assinado', `
    <p class="muted" style="margin-top:0;">
      Sobe aqui o PDF ${temArquivo ? '<b>substituindo</b> o que já está guardado' : 'assinado pelas duas partes'}.
      O arquivo fica num bucket privado — só abre por link temporário, nunca por URL pública.
    </p>
    <input type="hidden" id="f-status-atual" value="${esc(statusAtual || '')}">
    <div class="field">
      <label>Arquivo (PDF, até 20 MB)</label>
      <input type="file" id="f-arquivo" accept="application/pdf">
    </div>
    ${podeAvancar ? `
    <div class="checkrow" style="margin-bottom:12px;">
      <input type="checkbox" id="f-marca-assinado" checked>
      <label for="f-marca-assinado">Marcar o contrato como <b>assinado</b></label>
    </div>` : `
    <p class="dim" style="font-size:12px;margin:0 0 12px;">
      ${CT_PIPELINE.includes(statusAtual)
        ? `Este contrato já está em <b>${esc(statusLabel(statusAtual))}</b> — subir o arquivo não muda o status.`
        : `Não deu pra confirmar o status atual do contrato — subir o arquivo não muda o status, por segurança.`}
    </p>`}
    <div id="up-msg" class="dim" style="font-size:12px;"></div>
    <div class="row" style="justify-content:flex-end;margin-top:16px;">
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="confirmarSubirContrato('${esc(contratoId)}','${esc(clienteSlug)}')">Subir</button>
    </div>`);
}

async function confirmarSubirContrato(contratoId, clienteSlug){
  const input = document.getElementById('f-arquivo');
  const msg = document.getElementById('up-msg');
  const file = input && input.files && input.files[0];
  if(!file){ toast('Escolhe o PDF primeiro.'); return; }
  if(file.type !== 'application/pdf'){ toast('Só PDF — o bucket recusa outros formatos.'); return; }
  if(file.size > 20 * 1024 * 1024){ toast('Arquivo acima de 20 MB.'); return; }

  // O checkbox só existe no HTML quando dava pra avançar (ver
  // abrirSubirContrato/statusPodeAvancarPraAssinado) — se o contrato já
  // passou de 'assinado' no pipeline, o elemento nem é renderizado, então
  // `marcarAssinado` cai em false sozinho e o rpc_status_contrato nem é
  // chamado. Dupla checagem aqui (não só ausência de elemento) pra não
  // depender só do HTML não ter sido montado.
  const statusAtual = (document.getElementById('f-status-atual') || {}).value || '';
  const checkboxEl = document.getElementById('f-marca-assinado');
  const marcarAssinado = !!checkboxEl && checkboxEl.checked && statusPodeAvancarPraAssinado(statusAtual);
  const path = `${clienteSlug}/${contratoId}.pdf`;
  if(msg) msg.textContent = 'Subindo...';

  try{
    const { error } = await hubClient.storage.from(CONTRATO_BUCKET)
      .upload(path, file, { contentType: 'application/pdf', upsert: true });
    if(error) throw error;

    await rpc('hub_rpc_arquivo_contrato', { p: {
      contrato_id: contratoId, arquivo_path: path,
      arquivo_nome: file.name, arquivo_tipo: file.type,
    }});
    if(marcarAssinado){
      await rpc('hub_rpc_status_contrato', { p: { contrato_id: contratoId, status: 'assinado' } });
    }
    closeModal();
    toast('PDF guardado.' + (marcarAssinado ? ' Contrato marcado como assinado.' : ''));
    recarregarDepoisDoContrato(clienteSlug);
  } catch(e){
    if(msg) msg.textContent = '';
    toast(friendlyError(e));
  }
}

async function baixarContratoPDF(path){
  try{
    const { data, error } = await hubClient.storage.from(CONTRATO_BUCKET)
      .createSignedUrl(path, 60);           // 60s — link morre logo, de propósito
    if(error) throw error;
    window.open(data.signedUrl, '_blank', 'noopener');
  } catch(e){ toast(friendlyError(e)); }
}

function abrirTirarArquivoContrato(contratoId, clienteSlug, path){
  openModal('Tirar o PDF do contrato', `
    <p class="muted" style="margin-top:0;">
      Isso apaga o arquivo do bucket e desanexa do contrato. O contrato em si continua intacto.
    </p>
    <div class="row" style="justify-content:flex-end;margin-top:16px;">
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-danger" onclick="confirmarTirarArquivoContrato('${esc(contratoId)}','${esc(clienteSlug)}','${esc(path)}')">Tirar o PDF</button>
    </div>`);
}
async function confirmarTirarArquivoContrato(contratoId, clienteSlug, path){
  try{
    const { error } = await hubClient.storage.from(CONTRATO_BUCKET).remove([path]);
    if(error) throw error;
    await rpc('hub_rpc_arquivo_contrato', { p: {
      contrato_id: contratoId, arquivo_path: null, arquivo_nome: null, arquivo_tipo: null,
    }});
    closeModal(); toast('PDF removido.');
    recarregarDepoisDoContrato(clienteSlug);
  } catch(e){ toast(friendlyError(e)); }
}

// ---------- enviar pro cliente pelo WhatsApp (item 7) ----------
// Sem infra nova: reusa a Edge Function `wa-send`, que já está no ar desde o
// Bloco C (mesmo padrão de enviarConversa()). O Hub só ORQUESTRA — quem
// assina é ela e o cliente, no gov.br, como já fazem hoje.
// ⚠️ só id e slug viajam pelo onclick. Nome de cliente NÃO: esc() escapa aspas
// pra entidade HTML, que o parser devolve como aspas dentro do atributo e
// quebraria a string JS num nome tipo "D'Angelo". Nome e número são lidos do
// dado carregado, aqui dentro.
async function abrirEnviarContrato(contratoId, clienteSlug){
  const dados = (clienteAtual && clienteAtual.cliente && clienteAtual.cliente.slug === clienteSlug)
    ? clienteAtual
    : await rpc('hub_rpc_cliente', { p_slug: clienteSlug }).catch(()=>null);
  if(!dados){ toast('Não achei a ficha desse cliente.'); return; }
  const clienteNome = dados.cliente.nome;
  const item = (dados.contratos || []).find(x => x.contrato.id === contratoId);
  const numero = item && item.contrato.numero;

  const texto = `Oi! Segue o contrato${numero ? ' nº ' + numero : ''} pra você conferir e assinar.\n\n`
    + `Pode assinar pelo gov.br (assinador.iti.br) e me devolver o PDF assinado por aqui mesmo.\n\n`
    + `Qualquer dúvida, é só me chamar.`;
  openModal(`Enviar contrato — ${esc(clienteNome)}`, `
    <p class="muted" style="margin-top:0;">
      Vai pelo WhatsApp do contato principal. O <b>PDF você anexa na mão</b> — o Hub manda o
      texto e move o contrato pra <b>Enviado</b>.
    </p>
    <div class="field">
      <label>Mensagem</label>
      <textarea id="f-msg-contrato" rows="7">${esc(texto)}</textarea>
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:16px;">
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="confirmarEnviarContrato('${esc(contratoId)}','${esc(clienteSlug)}')">Enviar e marcar Enviado</button>
    </div>`);
}
async function confirmarEnviarContrato(contratoId, clienteSlug){
  const corpo = document.getElementById('f-msg-contrato').value.trim();
  if(!corpo){ toast('Escreve a mensagem antes de enviar.'); return; }

  const dados = (clienteAtual && clienteAtual.cliente && clienteAtual.cliente.slug === clienteSlug)
    ? clienteAtual
    : await rpc('hub_rpc_cliente', { p_slug: clienteSlug }).catch(()=>null);
  const contato = ((dados && dados.contatos) || [])
    .filter(c => c.whatsapp_e164)
    .sort((a,b) => (b.is_principal?1:0) - (a.is_principal?1:0))[0];
  if(!contato){ toast('Esse cliente não tem WhatsApp cadastrado na ficha.'); return; }
  if(!hubClient.functions){ toast('Envio ainda não ativado — falta configurar a chave da Evolution.'); return; }

  try{
    const { data, error } = await hubClient.functions.invoke('wa-send', {
      body: { fone: contato.whatsapp_e164, corpo, cliente_id: dados.cliente.id, eh_grupo: !!contato.eh_grupo },
    });
    if(error) throw error;
    if(data && data.erro) throw new Error(data.erro);
    await rpc('hub_rpc_status_contrato', { p: { contrato_id: contratoId, status: 'enviado' } });
    conversasResumo = null;
    closeModal(); toast('Contrato enviado — status agora é Enviado.');
    recarregarDepoisDoContrato(clienteSlug);
  } catch(e){ toast(erroEnvioWhats(e)); }
}

// depois de mexer num contrato, redesenha a tela em que ela está
function recarregarDepoisDoContrato(clienteSlug){
  const { page } = currentRoute();
  if(page === 'contratos') renderContratos();
  else renderCliente(clienteSlug);
}

// ---------- a tela #/contratos ----------
// Layout portado do vContratos() do mockup-v2-frontend.html (tabela
// Cliente · Nº · Serviço · Valor · Status · ações), com os KPIs dele e o
// filtro por status no padrão .chips já usado na Carteira.
let contratosCache = [];
let contratosFiltro = 'todos';
const CT_DIAS_ESPERA = 7;   // "esperando devolução" a partir daqui

function setContratosFiltro(f){ contratosFiltro = f; desenharContratos(); }

async function renderContratos(){
  root.innerHTML = shell('contratos', `<div class="empty"><div class="spinner" style="margin:0 auto;"></div></div>`);
  contratosCache = await rpc('hub_rpc_contratos').catch(()=>[]);
  desenharContratos();
}

function desenharContratos(){
  const todos = contratosCache || [];
  const assinados = todos.filter(c => ['assinado','ativo'].includes(c.status)).length;
  const naRua = todos.filter(c => ['emitido','enviado','rascunho'].includes(c.status)).length;
  const comPdf = todos.filter(c => c.tem_arquivo).length;

  // "Esperando devolução": enviado e sem movimento há mais de N dias.
  // ⚠️ o relógio é `updated_at`, que é "sem movimento desde", não "enviado
  // em" — qualquer edição do contrato zera a contagem. Ver relatório do D2.
  const agora = Date.now();
  const diasParados = c => Math.floor((agora - new Date(c.updated_at).getTime()) / 86400000);
  const esperando = todos
    .filter(c => c.status === 'enviado' && diasParados(c) >= CT_DIAS_ESPERA)
    .sort((a,b) => diasParados(b) - diasParados(a));

  const visiveis = contratosFiltro === 'todos'
    ? todos : todos.filter(c => c.status === contratosFiltro);

  const linhas = visiveis.map(c => `
    <tr>
      <td data-label="Cliente" onclick="location.hash='#/cliente/${esc(c.cliente_slug)}'" style="cursor:pointer;"><b>${esc(c.cliente_nome)}</b></td>
      <td data-label="Nº" class="dim">${c.numero ? esc(c.numero) : '—'}</td>
      <td data-label="Serviço" class="muted">${esc(c.servico || '—')}</td>
      <td data-label="Valor" style="text-align:right;">${centavosToBRL(c.valor_mensal_centavos)}</td>
      <td data-label="Vencimento">${c.dia_vencimento ? 'dia ' + c.dia_vencimento : '—'}</td>
      <td data-label="Status">
        <span class="badge ${contratoBadgeClass(c.status)}">${statusLabel(c.status)}</span>
        ${c.tem_arquivo ? '<span class="badge badge-ok" style="margin-left:5px;" title="PDF assinado guardado">PDF</span>' : ''}
      </td>
      <td data-label="Ações" onclick="event.stopPropagation()">
        <div class="row" style="justify-content:flex-end;gap:6px;flex-wrap:wrap;">
          ${botoesContrato(c.contrato_id, c.cliente_slug, c.status, c.tem_arquivo, c.arquivo_path)}
        </div>
      </td>
    </tr>`).join('');

  const chip = (k, rotulo, n) =>
    `<button class="chip ${contratosFiltro===k?'on':''}" onclick="setContratosFiltro('${k}')">${rotulo} (${n})</button>`;

  root.innerHTML = shell('contratos', `
    <div class="row-between" style="margin-bottom:14px;flex-wrap:wrap;gap:10px;">
      <h2 class="section-title" style="margin:0;">Contratos</h2>
    </div>
    <div class="kpis">
      <div class="kpi ok"><div class="kpi-head">${KPI_ICONS.check}<span class="label">Assinados / ativos</span></div><div class="value">${assinados}</div></div>
      <div class="kpi ${naRua?'warn':''}"><div class="kpi-head">${KPI_ICONS.clock}<span class="label">Na rua</span></div><div class="value">${naRua}</div></div>
      <div class="kpi"><div class="kpi-head">${KPI_ICONS.briefcase}<span class="label">Com PDF guardado</span></div><div class="value">${comPdf}</div></div>
    </div>

    ${esperando.length ? `
      <div class="card" style="margin-bottom:16px;">
        <p class="eyebrow" style="color:var(--warn);margin:0 0 8px;">Esperando devolução</p>
        ${esperando.map(c => `<div class="rowcard" style="margin-bottom:6px;">
          <div class="l">
            <div class="t">${esc(c.cliente_nome)}${c.numero ? ' · nº ' + esc(c.numero) : ''}</div>
            <div class="s">sem movimento há ${diasParados(c)} dias</div>
          </div>
          <div class="r">
            <button class="btn btn-sm btn-outline" onclick="abrirEnviarContrato('${esc(c.contrato_id)}','${esc(c.cliente_slug)}')">Cobrar</button>
          </div>
        </div>`).join('')}
      </div>` : ''}

    <div class="chips">
      ${chip('todos','Todos', todos.length)}
      ${['ativo','assinado','enviado','emitido','rascunho','encerrado']
        .map(s => chip(s, statusLabel(s), todos.filter(c=>c.status===s).length)).join('')}
    </div>

    <div class="tablewrap">
      <table>
        <thead><tr><th>Cliente</th><th>Nº</th><th>Serviço</th><th style="text-align:right">Valor</th><th>Vencimento</th><th>Status</th><th></th></tr></thead>
        <tbody>${linhas || `<tr><td colspan="7" class="empty">Nenhum contrato nesse filtro.</td></tr>`}</tbody>
      </table>
    </div>
    <p class="dim" style="font-size:12px;margin-top:16px;">
      Padrão MODELO-BASE: vigência mínima 3 meses · Pix · foro Recife · Anexo I por serviço.
      O PDF é montado do molde, sem IA. Quem assina é você e o cliente, no gov.br — o Hub só acompanha.
    </p>
  `);
}

// os mesmos botões na tela de Contratos e no card da ficha do cliente.
// Só id, slug, status e path viajam pelo onclick — status é um dos 6 valores
// fixos do pipeline (nunca texto livre), o resto sem aspas por construção.
// `status` vai junto pro upload saber se o checkbox "marcar assinado" pode
// avançar ou se o contrato já passou desse ponto (statusPodeAvancarPraAssinado).
function botoesContrato(id, slug, status, temArquivo, path){
  return `
    <button class="btn btn-sm btn-outline" title="Gerar o PDF do contrato pelo modelo" onclick="emitirContrato('${esc(id)}','${esc(slug)}')">Gerar PDF</button>
    <button class="btn btn-sm btn-outline" title="Mandar pro cliente pelo WhatsApp" onclick="abrirEnviarContrato('${esc(id)}','${esc(slug)}')">Enviar</button>
    ${temArquivo
      ? `<button class="btn btn-sm btn-outline" title="Abrir o PDF assinado" onclick="baixarContratoPDF('${esc(path)}')">Ver PDF</button>
         <button class="btn btn-ico btn-ico-danger" title="Tirar o PDF" onclick="abrirTirarArquivoContrato('${esc(id)}','${esc(slug)}','${esc(path)}')">${TRASH_ICON}</button>`
      : ''}
    <button class="btn btn-sm btn-outline" title="${temArquivo ? 'Trocar o PDF assinado' : 'Subir o PDF assinado'}" onclick="abrirSubirContrato('${esc(id)}','${esc(slug)}','${esc(status||'')}',${temArquivo?'true':'false'})">${temArquivo ? 'Trocar PDF' : 'Subir assinado'}</button>`;
}

// ============================================================
// REUNIÕES — ponte com o Meetily (Fase 3, Bloco D — D3)
//
// Sem mockup de referência fiel (vReunioes() do mockup-v2-frontend.html
// listava reunião fictícia com "Abrir no Meetily" — aqui a reunião já chega
// pronta no banco, então o card abre o DETALHE, não um app externo).
// Layout: rowcards no padrão de Contratos/Cobranças + modal largo pro
// detalhe (resumo, vínculo, análise comercial, transcrição colapsável).
//
// A transcrição NUNCA aparece na lista (hub_rpc_reunioes não devolve o
// campo, de propósito — só o detalhe, uma reunião por vez, igual à cautela
// já usada em Conversas).
// ============================================================
let reunioesCache = [];
let reuniaoFiltro = 'todas'; // todas | sem_vinculo | vinculadas

function formatarDataHoraReuniao(ts){
  if(!ts) return 'sem data';
  const d = new Date(ts);
  if(isNaN(d.getTime())) return 'sem data';
  return d.toLocaleDateString('pt-BR', {day:'2-digit',month:'2-digit',year:'numeric'})
    + ' às ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});
}

function setReuniaoFiltro(f){ reuniaoFiltro = f; desenharReunioes(); }

async function renderReunioes(){
  root.innerHTML = shell('reunioes', `<div class="empty"><div class="spinner" style="margin:0 auto;"></div></div>`);
  reunioesCache = await rpc('hub_rpc_reunioes').catch(()=>[]);
  desenharReunioes();
}

function desenharReunioes(){
  const todas = reunioesCache || [];
  const comAnalise = todas.filter(r => r.tem_analise).length;
  const semVinculo = todas.filter(r => !r.prospect_id && !r.cliente_id).length;

  const visiveis = todas.filter(r => {
    if(reuniaoFiltro === 'sem_vinculo') return !r.prospect_id && !r.cliente_id;
    if(reuniaoFiltro === 'vinculadas') return !!(r.prospect_id || r.cliente_id);
    return true;
  });

  const linhas = visiveis.map(r => {
    const vinculo = r.cliente_nome
      ? `<span class="badge badge-ok" onclick="event.stopPropagation();location.hash='#/cliente/${esc(r.cliente_slug)}'" style="cursor:pointer;">${esc(r.cliente_nome)}</span>`
      : (r.prospect_nome
          ? `<span class="badge badge-roxo" onclick="event.stopPropagation();location.hash='#/prospect/${esc(r.prospect_id)}'" style="cursor:pointer;">${esc(r.prospect_nome)}</span>`
          : `<span class="badge badge-muted">sem vínculo</span>`);
    const chars = r.transcricao_chars
      ? `${Number(r.transcricao_chars).toLocaleString('pt-BR')} caract. de transcrição`
      : (r.tem_transcricao ? 'com transcrição' : 'sem transcrição');
    return `
    <div class="rowcard" style="cursor:pointer;" onclick="abrirReuniao('${esc(r.id)}')">
      <div class="l">
        <div class="t">${esc(r.titulo || 'Reunião sem título')}</div>
        <div class="s">${formatarDataHoraReuniao(r.realizada_em)} · ${chars}</div>
      </div>
      <div class="r">
        ${vinculo}
        ${r.tem_analise ? '<span class="badge badge-ok">Análise pronta</span>' : '<span class="badge badge-muted">Sem análise</span>'}
      </div>
    </div>`;
  }).join('');

  root.innerHTML = shell('reunioes', `
    <div class="row-between" style="margin-bottom:14px;">
      <h2 class="section-title" style="margin:0;">Reuniões</h2>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="kpi-head">${KPI_ICONS.calendar}<span class="label">Total</span></div><div class="value">${todas.length}</div></div>
      <div class="kpi ok"><div class="kpi-head">${KPI_ICONS.check}<span class="label">Com análise</span></div><div class="value">${comAnalise}</div></div>
      <div class="kpi ${semVinculo?'warn':''}"><div class="kpi-head">${KPI_ICONS.userCheck}<span class="label">Sem vínculo</span></div><div class="value">${semVinculo}</div></div>
    </div>
    <div class="chips">
      <button class="chip ${reuniaoFiltro==='todas'?'on':''}" onclick="setReuniaoFiltro('todas')">Todas (${todas.length})</button>
      <button class="chip ${reuniaoFiltro==='sem_vinculo'?'on':''}" onclick="setReuniaoFiltro('sem_vinculo')">Sem vínculo (${semVinculo})</button>
      <button class="chip ${reuniaoFiltro==='vinculadas'?'on':''}" onclick="setReuniaoFiltro('vinculadas')">Vinculadas (${todas.length - semVinculo})</button>
    </div>
    ${linhas || '<div class="empty">Nenhuma reunião ainda. A ponte <code>subir-reuniao</code> sobe uma de cada vez, direto do Meetily no seu Mac — nunca sozinha.</div>'}
    <p class="dim" style="font-size:12px;margin-top:16px;">
      Reunião só entra aqui quando você escolhe subir ela do Meetily. Clique num card pra ver resumo,
      vincular a um prospect/cliente, gerar a análise comercial ou ler a transcrição inteira.
    </p>
  `);
}

// ---------- detalhe (modal largo) ----------
async function abrirReuniao(id){
  openModal('Carregando…', `<div class="empty"><div class="spinner" style="margin:0 auto;"></div></div>`, 'wide');
  const [detalhe] = await Promise.all([
    rpc('hub_rpc_reuniao', { p_id: id }).catch(()=>null),
    loadCarteiraCache(),
    (async () => { if(!prospectsCache.length) prospectsCache = await rpc('hub_rpc_prospects').catch(()=>[]); })(),
  ]);
  if(!detalhe || !detalhe.reuniao){ closeModal(); toast('Não achei essa reunião.'); return; }
  desenharReuniao(detalhe);
}

function desenharReuniao(detalhe){
  const r = detalhe.reuniao;

  const optsProspect = ['<option value="">— nenhum —</option>']
    .concat(prospectsCache.map(p => `<option value="${esc(p.id)}" ${r.prospect_id===p.id?'selected':''}>${esc(p.nome)}</option>`))
    .join('');
  const optsCliente = ['<option value="">— nenhum —</option>']
    .concat(carteira.map(c => `<option value="${esc(c.cliente_id)}" ${r.cliente_id===c.cliente_id?'selected':''}>${esc(c.nome)}</option>`))
    .join('');

  const analiseHtml = r.analise
    ? renderAnaliseReuniao(r.analise, r.id)
    : `
      <p class="muted" style="margin:8px 0 12px;">Ainda sem análise.</p>
      <button class="btn btn-primary btn-sm" id="btn-analisar-reuniao"
        onclick="gerarAnaliseReuniao('${esc(r.id)}')"
        ${(!r.transcricao && !r.resumo) ? 'disabled title="Essa reunião não tem transcrição nem resumo"' : ''}>
        Analisar com IA
      </button>`;

  const transcricaoHtml = r.transcricao ? `
    <details style="margin-top:14px;">
      <summary style="cursor:pointer;font-size:12.5px;color:var(--fraco);">Ver transcrição completa (${String(r.transcricao).length.toLocaleString('pt-BR')} caracteres)</summary>
      <pre style="white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:11.5px;color:var(--suave);background:var(--poco);border:1px solid var(--borda);border-radius:10px;padding:12px;margin-top:8px;max-height:280px;overflow:auto;">${esc(r.transcricao)}</pre>
    </details>` : '';

  openModal(esc(r.titulo || 'Reunião sem título'), `
    <p class="dim" style="font-size:12px;margin-top:-6px;margin-bottom:16px;">
      ${formatarDataHoraReuniao(r.realizada_em)} · <span style="font-family:var(--mono);">${esc(r.meetily_meeting_id)}</span>
    </p>

    <div class="f2">
      <div class="field">
        <label>Vincular ao prospect</label>
        <select id="f-reuniao-prospect">${optsProspect}</select>
      </div>
      <div class="field">
        <label>Vincular ao cliente</label>
        <select id="f-reuniao-cliente">${optsCliente}</select>
      </div>
    </div>
    <button class="btn btn-outline btn-sm" style="margin-bottom:18px;" onclick="salvarVinculoReuniao('${esc(r.id)}')">Salvar vínculo</button>

    ${r.resumo ? `
      <p class="eyebrow">Resumo</p>
      <div class="card" style="white-space:pre-wrap;font-size:13px;margin-bottom:18px;">${esc(r.resumo)}</div>
    ` : ''}

    <p class="eyebrow">Análise comercial</p>
    <div id="bloco-analise-reuniao">${analiseHtml}</div>

    ${transcricaoHtml}

    <div class="row" style="justify-content:flex-end;margin-top:18px;">
      <button class="btn btn-outline" onclick="closeModal()">Fechar</button>
    </div>
  `, 'wide');
}

// preço SÓ do que a Edge Function já validou contra o catálogo (ver
// supabase/functions/reuniao-analisar) — aqui é só desenhar o que voltou.
function renderAnaliseReuniao(a, reuniaoId){
  const cliente = a.cliente || {};
  const prazo = a.prazo || {};
  const proposta = a.proposta || {};
  const urgenciaCls = {alta:'badge-bad', media:'badge-warn', baixa:'badge-muted'}[prazo.urgencia] || 'badge-muted';
  const confiancaCls = {alta:'badge-ok', media:'badge-warn', baixa:'badge-bad'}[cliente.confianca] || 'badge-muted';

  const listaOu = (arr, vazio) => (Array.isArray(arr) && arr.length)
    ? `<ul style="margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--suave);">${arr.map(i=>`<li style="margin-bottom:3px;">${esc(i)}</li>`).join('')}</ul>`
    : `<p class="dim" style="font-size:12.5px;margin:4px 0 0;">${esc(vazio)}</p>`;

  const itens = (proposta.itens || []).map(it => `
    <div class="rowcard" style="margin-bottom:6px;">
      <div class="l">
        <div class="t">${esc(it.servico_nome || 'item')}${it.quantidade > 1 ? ' × ' + it.quantidade : ''}</div>
        ${it.fora_do_catalogo
          ? `<div class="s" style="color:var(--warn);">${esc(it.observacao || 'fora do catálogo')}</div>`
          : (it.justificativa ? `<div class="s">${esc(it.justificativa)}</div>` : '')}
      </div>
      <div class="r">
        ${it.preco_centavos != null ? `<b>${centavosToBRL(it.subtotal_centavos)}</b>` : '<span class="badge badge-muted">sem preço</span>'}
      </div>
    </div>`).join('');

  return `
    <div class="card" style="margin-bottom:12px;">
      <div class="row-between" style="margin-bottom:8px;flex-wrap:wrap;gap:8px;">
        <b style="font-size:14px;">${esc(cliente.nome || 'a confirmar')}</b>
        <span class="badge ${confiancaCls}">confiança ${esc(cliente.confianca || '—')}</span>
      </div>
      ${cliente.quem_e ? `<p class="muted" style="font-size:13px;margin:0 0 10px;">${esc(cliente.quem_e)}</p>` : ''}

      <p class="eyebrow">Dor real</p>
      <p style="font-size:13px;margin:2px 0 10px;">${esc(a.dor || '—')}</p>

      <p class="eyebrow">Escopo pedido</p>
      ${listaOu(a.escopo_pedido, 'nada registrado')}

      <p class="eyebrow" style="margin-top:10px;">Prazo</p>
      <p style="font-size:13px;margin:2px 0 10px;">
        <span class="badge ${urgenciaCls}">urgência ${esc(prazo.urgencia || '—')}</span>
        ${prazo.prazo_citado ? ' · ' + esc(prazo.prazo_citado) : ''}
        ${prazo.por_que ? `<br><span class="dim" style="font-size:12px;">${esc(prazo.por_que)}</span>` : ''}
      </p>

      <p class="eyebrow">Combinados</p>
      ${listaOu(a.combinados, 'nada registrado')}

      <p class="eyebrow" style="margin-top:10px;">Próximos passos</p>
      ${listaOu(a.proximos_passos, 'nada registrado')}

      ${(a.alertas && a.alertas.length) ? `
        <p class="eyebrow" style="margin-top:10px;color:var(--warn);">Alertas</p>
        ${listaOu(a.alertas, '')}
      ` : ''}
    </div>

    <p class="eyebrow">Proposta (preço só do catálogo)</p>
    ${itens || '<p class="dim" style="font-size:12.5px;">Sem itens.</p>'}
    ${proposta.total_centavos != null
      ? `<div class="row-between" style="margin-top:8px;"><b>Total${proposta.total_parcial ? ' (parcial)' : ''}</b><b>${centavosToBRL(proposta.total_centavos)}</b></div>`
      : (proposta.itens && proposta.itens.length ? '<p class="dim" style="font-size:12px;margin-top:6px;">Total não calculado — algum item sem preço de referência.</p>' : '')}
    ${proposta.raciocinio ? `<p class="muted" style="font-size:12.5px;margin-top:8px;">${esc(proposta.raciocinio)}</p>` : ''}

    <button class="btn btn-outline btn-sm" id="btn-analisar-reuniao" style="margin-top:14px;" onclick="gerarAnaliseReuniao('${esc(reuniaoId)}')">Analisar de novo</button>
  `;
}

async function salvarVinculoReuniao(id){
  const prospectId = document.getElementById('f-reuniao-prospect').value || null;
  const clienteId = document.getElementById('f-reuniao-cliente').value || null;
  try{
    await rpc('hub_rpc_amarrar_reuniao', { p: { id, prospect_id: prospectId, cliente_id: clienteId } });
    toast('Vínculo salvo.');
    reunioesCache = await rpc('hub_rpc_reunioes').catch(()=>reunioesCache);
    desenharReunioes();
    const detalhe = await rpc('hub_rpc_reuniao', { p_id: id }).catch(()=>null);
    if(detalhe && detalhe.reuniao) desenharReuniao(detalhe);
  } catch(e){ toast(friendlyError(e)); }
}

// A Edge Function já valida cada item da proposta contra o catálogo antes de
// gravar (ver header de reuniao-analisar) — aqui só chama, espera e redesenha.
async function gerarAnaliseReuniao(id){
  const botao = document.getElementById('btn-analisar-reuniao');
  if(botao){ botao.disabled = true; botao.textContent = 'Analisando…'; }

  if(!hubClient.functions){
    toast('Análise ainda não ativada — falta configurar a chave do Gemini.');
    if(botao){ botao.disabled = false; botao.textContent = 'Analisar com IA'; }
    return;
  }

  try{
    const { data, error } = await hubClient.functions.invoke('reuniao-analisar', { body: { reuniao_id: id } });
    if(error) throw error;
    if(data && data.erro) throw new Error(data.detalhe || data.erro);
    toast('Análise gerada.');
    reunioesCache = await rpc('hub_rpc_reunioes').catch(()=>reunioesCache);
    desenharReunioes();
    const detalhe = await rpc('hub_rpc_reuniao', { p_id: id }).catch(()=>null);
    if(detalhe && detalhe.reuniao) desenharReuniao(detalhe);
  } catch(e){
    toast(erroAnaliseReuniao(e));
    if(botao){ botao.disabled = false; botao.textContent = 'Analisar com IA'; }
  }
}

function erroAnaliseReuniao(err){
  const m = (err && err.message) || String(err);
  if(/GEMINI_API_KEY|nao ativada|não ativada/i.test(m)) return 'Análise ainda não ativada — falta configurar a chave do Gemini no Supabase.';
  if(/catalogo de servicos vazio|catálogo de serviços vazio/i.test(m)) return 'Sem catálogo de serviços cadastrado — a proposta precisa dele.';
  if(/sem transcricao nem resumo|sem transcrição nem resumo/i.test(m)) return 'Essa reunião não tem transcrição nem resumo pra analisar.';
  if(/not found|404|failed to (send|fetch)|networkerror|non-2xx/i.test(m)) return 'Não consegui falar com a análise — confere se a Edge Function reuniao-analisar está publicada e a chave do Gemini está configurada.';
  return 'A análise não foi gerada: ' + m;
}

// ============================================================
// COBRANÇAS — configuração por cliente + textos da régua (Fase 3, Bloco B)
// Sem mockup de referência (vCobrancas() do mockup é a fila do bot, não o
// editor de config) — desenhado no design system das telas #/custos e
// #/catalogo. O bot (HUB — Cobrança Automática) segue INATIVO nesta rodada
// — "Últimos envios" fica vazio até D19/D20 ligarem de verdade.
//
// Vencimento e WhatsApp aparecem ao vivo do contrato ativo / contato
// principal do cliente (mesma fonte que o bot usa) — não são editáveis
// aqui, só em Contratos/ficha do cliente. "Últimos envios" lê o log real
// (hub.cobranca_envios, por recebível+bucket) que o bot já escreve.
// ============================================================
let cobrancaConfigCache = [];
let cobrancaMensagensCache = [];
let cobrancaEnviosCache = [];
const ETAPA_LABEL = {'d_menos_3':'D-3 · 3 dias antes','d0':'D0 · dia do vencimento','d_mais_2':'D+2 · 2 dias de atraso','d_mais_7':'D+7 · último aviso','escalado':'Escalado · avisou você'};

// ⚠️ NÃO "consertar": esta tela lista cliente avulso (Pandoka) e a Carteira
// não — a diferença é INTENCIONAL (D1.1). A carteira é recorrência; Cobranças
// é "quem me deve", e a Pandoka deve R$ 1.599 com vencimento em 15/11.
// hub.rpc_cobranca_config_lista (012) lê hub.clientes direto, sem passar pela
// carteira, e é assim que tem que ser.
async function renderCobrancas(){
  root.innerHTML = shell('cobrancas', `<div class="empty"><div class="spinner" style="margin:0 auto;"></div></div>`);
  await loadCarteiraCache();
  [cobrancaConfigCache, cobrancaMensagensCache, cobrancaEnviosCache] = await Promise.all([
    rpc('hub_rpc_cobranca_config_lista').catch(()=>[]),
    rpc('hub_rpc_cobranca_mensagens').catch(()=>[]),
    rpc('hub_rpc_cobranca_envios_recentes', { p_limit: 20 }).catch(()=>[]),
  ]);
  desenharCobrancas();
}

function desenharCobrancas(){
  const naRegua = cobrancaConfigCache.filter(c=>c.ativo && c.dia_vencimento).length;
  const semConfig = cobrancaConfigCache.filter(c=>!c.config_id).length;

  const linhas = cobrancaConfigCache.map((c,i) => `
    <tr onclick="abrirEditarCobrancaConfig(${i})">
      <td data-label="Cliente"><b>${esc(c.cliente_nome)}</b></td>
      <td data-label="Método">${c.config_id ? (c.metodo==='mp_link'?'Link Mercado Pago':'Pix') : '<span class="dim">não configurado</span>'}</td>
      <td data-label="Vencimento">${c.dia_vencimento ? 'dia '+c.dia_vencimento : '—'}</td>
      <td data-label="WhatsApp">${c.whatsapp_e164 ? esc(c.whatsapp_e164) : '<span class="dim">sem WhatsApp — escala pra você</span>'}</td>
      <td data-label="Status">${c.config_id ? (c.ativo ? '<span class="badge badge-ok">Ativo</span>' : '<span class="badge badge-muted">Pausado</span>') : ''}</td>
    </tr>`).join('');

  const reguaCards = cobrancaMensagensCache.map((m,i) => `
    <div class="card" style="margin-bottom:12px;">
      <div class="row-between" style="margin-bottom:8px;">
        <span class="eyebrow" style="margin:0;">${esc(ETAPA_LABEL[m.etapa] || m.etapa)}</span>
        <button class="btn btn-sm btn-outline" onclick="salvarCobrancaMensagem(${i})">Salvar</button>
      </div>
      <textarea id="regua-${i}" rows="3" class="regua-texto">${esc(m.texto)}</textarea>
      ${m.texto.startsWith('RASCUNHO') ? '<div class="flag" style="margin-top:8px;">🟡 rascunho — copiar do node Configuração do workflow antes de ativar o bot</div>' : ''}
    </div>`).join('');

  const envios = cobrancaEnviosCache.length ? cobrancaEnviosCache.map(e => {
    return `<div class="rowcard"><div class="l"><div class="t">${esc(e.cliente_nome)}</div><div class="s">${esc(ETAPA_LABEL[e.etapa]||e.etapa)} · ${formatDateBR(e.enviado_em.slice(0,10))}</div></div><div class="r"><span class="badge badge-ok">enviado</span></div></div>`;
  }).join('') : `<div class="muted">Nenhum envio ainda — o bot está inativo (falta chip dedicado + disparo assistido, ver Hub Dev.md).</div>`;

  root.innerHTML = shell('cobrancas', `
    <h2 class="section-title" style="margin:0 0 6px;">Cobranças — bot automático</h2>
    <p class="muted" style="margin:0 0 18px;font-size:13px;">Configuração por cliente pro bot de cobrança — ele ainda está inativo (falta chip dedicado e disparo assistido).</p>
    <div class="kpis">
      <div class="kpi"><div class="kpi-head">${KPI_ICONS.calendar}<span class="label">Na régua</span></div><div class="value">${naRegua}</div></div>
      <div class="kpi ${semConfig?'warn':''}"><div class="kpi-head">${KPI_ICONS.warn}<span class="label">Sem configuração</span></div><div class="value">${semConfig}</div></div>
      <div class="kpi"><div class="kpi-head">${KPI_ICONS.check}<span class="label">Envios (log)</span></div><div class="value">${cobrancaEnviosCache.length}</div></div>
    </div>

    <h2 class="section-title" style="margin:24px 0 12px;">Configuração por cliente</h2>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Cliente</th><th>Método</th><th>Vencimento</th><th>WhatsApp</th><th>Status</th></tr></thead>
        <tbody>${linhas || `<tr><td colspan="5" class="empty">Nenhum cliente ativo.</td></tr>`}</tbody>
      </table>
    </div>

    <h2 class="section-title" style="margin:28px 0 12px;">Textos da régua</h2>
    ${reguaCards}

    <h2 class="section-title" style="margin:28px 0 12px;">Últimos envios</h2>
    <div>${envios}</div>
  `);
}

function formCobrancaConfig(c){
  return `
    <form onsubmit="return salvarCobrancaConfig(event)">
      <input type="hidden" id="f-cliente-id" value="${esc(c.cliente_id)}">
      <div class="field"><label>Método</label>
        <select id="f-metodo">
          <option value="pix" ${c.metodo!=='mp_link'?'selected':''}>Pix</option>
          <option value="mp_link" ${c.metodo==='mp_link'?'selected':''}>Link Mercado Pago</option>
        </select>
      </div>
      <div class="field"><label>Vencimento</label><div class="muted">${c.dia_vencimento ? 'dia '+c.dia_vencimento+' — vem do contrato ativo' : 'sem contrato ativo com vencimento — edite em Contratos'}</div></div>
      <div class="field"><label>WhatsApp</label><div class="muted">${c.whatsapp_e164 ? esc(c.whatsapp_e164)+' — vem do contato principal' : 'sem WhatsApp cadastrado — edite na ficha do cliente'}</div></div>
      <div class="checkrow" style="margin-bottom:12px;"><input type="checkbox" id="f-ativo" ${c.config_id ? (c.ativo?'checked':'') : 'checked'}> <label for="f-ativo">Ativo na régua</label></div>
      <div class="row" style="justify-content:flex-end;margin-top:16px;">
        <button type="button" class="btn btn-outline" onclick="closeModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar</button>
      </div>
    </form>`;
}
function abrirEditarCobrancaConfig(i){
  openModal(`Cobrança — ${esc(cobrancaConfigCache[i].cliente_nome)}`, formCobrancaConfig(cobrancaConfigCache[i]));
}
async function salvarCobrancaConfig(ev){
  ev.preventDefault();
  try{
    await rpc('hub_rpc_salvar_cobranca_config', { p: {
      cliente_id: document.getElementById('f-cliente-id').value,
      metodo: document.getElementById('f-metodo').value,
      ativo: document.getElementById('f-ativo').checked,
    }});
    closeModal(); toast('Configuração de cobrança salva.');
    renderCobrancas();
  } catch(e){}
  return false;
}
async function salvarCobrancaMensagem(i){
  const m = cobrancaMensagensCache[i];
  const texto = document.getElementById('regua-'+i).value.trim();
  if(!texto){ toast('Texto não pode ficar vazio.'); return; }
  try{
    await rpc('hub_rpc_salvar_cobranca_mensagem', { p: { etapa: m.etapa, texto } });
    toast('Texto da régua salvo.');
    renderCobrancas();
  } catch(e){}
}

// ============================================================
// ROUTER
// ============================================================
async function render(){
  if(!session){ renderLogin(); return; }
  if((session.user.email||'').toLowerCase() !== HUB_ADMIN_EMAIL.toLowerCase()){ renderAcessoNegado(); return; }

  const { page, param } = currentRoute();
  if(page === 'cliente' && param) return renderCliente(param);
  if(page === 'carteira') return renderCarteira();
  if(page === 'catalogo') return renderCatalogo();
  if(page === 'financeiro') return renderFinanceiro();
  if(page === 'custos') return renderCustos();
  if(page === 'crm') return renderCRM();
  if(page === 'prospect' && param) return renderProspect(param);
  if(page === 'cobrancas') return renderCobrancas();
  if(page === 'contratos') return renderContratos();
  if(page === 'reunioes') return renderReunioes();
  if(['posts','trafego','criacao','dev'].includes(page)) return renderEmConstrucao(page);
  return renderDash();
}

init();
