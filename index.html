// ============================================================

// ============================================================
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3200);
}
function centavosToBRL(c){
  if(c==null) return '—';
  return (Number(c)/100).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
}
function centavosCompact(c){
  const v = Number(c||0)/100;
  if(v >= 1000) return 'R$' + (v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1}) + 'k';
  return 'R$' + v.toLocaleString('pt-BR',{maximumFractionDigits:0});
}
function brlInputToCentavos(v){
  if(v === '' || v == null) return null;
  return Math.round(parseFloat(String(v).replace(',','.')) * 100);
}
function centavosToInputValue(c){
  if(c == null) return '';
  return (Number(c)/100).toFixed(2);
}
function todayISO(){
  return new Date().toLocaleDateString('sv-SE'); // yyyy-mm-dd no fuso local
}
function formatDateBR(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
// tempo relativo curto ("agora", "há 2h", "ontem", "22/09") — usado no card do
// kanban e no carimbo das bolhas de conversa. Entra timestamptz do Postgres.
function tempoRelativo(ts){
  if(!ts) return '';
  const d = new Date(ts);
  if(isNaN(d.getTime())) return '';
  const seg = (Date.now() - d.getTime())/1000;
  if(seg < 0) return 'agora';
  if(seg < 60) return 'agora';
  if(seg < 3600) return 'há ' + Math.floor(seg/60) + 'min';
  if(seg < 86400) return 'há ' + Math.floor(seg/3600) + 'h';
  const dias = Math.floor(seg/86400);
  if(dias === 1) return 'ontem';
  if(dias < 7) return 'há ' + dias + ' dias';
  return d.toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit' });
}
// carimbo da bolha: hoje só a hora, ontem/antes com o dia junto
function carimboMsg(ts){
  if(!ts) return '';
  const d = new Date(ts);
  if(isNaN(d.getTime())) return '';
  const hora = d.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
  const hoje = new Date();
  const mesmoDia = d.toDateString() === hoje.toDateString();
  if(mesmoDia) return hora;
  const ontem = new Date(hoje.getTime() - 86400000);
  if(d.toDateString() === ontem.toDateString()) return 'ontem ' + hora;
  return d.toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit' }) + ' ' + hora;
}
function truncar(s, n){
  s = String(s == null ? '' : s);
  return s.length > n ? s.slice(0, n - 1).trimEnd() + '…' : s;
}
function monthLabel(competenciaISO){
  const meses = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const m = parseInt(competenciaISO.split('-')[1], 10) - 1;
  return meses[m];
}
function slugify(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}
function statusLabel(s){
  if(!s) return '—';
  return {
    prospect:'Prospect', ativo:'Ativo', pausado:'Pausado', encerrado:'Encerrado',
    rascunho:'Rascunho', emitido:'Emitido', enviado:'Enviado', assinado:'Assinado',
    aberto:'Aberto', parcial:'Parcial', pago:'Pago', vencido:'Vencido',
    aberta:'Aberta', fazendo:'Fazendo', entregue:'Entregue',
  }[s] || s;
}
function contratoBadgeClass(status){
  if(status === 'ativo' || status === 'assinado' || status === 'pago') return 'badge-ok';
  if(status === 'rascunho' || status === 'parcial' || status === 'aberto') return 'badge-warn';
  if(status === 'vencido') return 'badge-bad';
  return 'badge-muted';
}
function friendlyError(err){
  const m = (err && err.message) || String(err);
  if(m.includes('hub_contrato_ativo_exige_porta_saida')) return 'Não dá pra ativar o contrato sem porta de saída escrita.';
  if(m.includes('acesso negado')) return 'Sessão sem permissão pra essa ação.';
  if(m.includes('Could not find the function')) return 'Essa função ainda não está instalada no banco — migration pendente de aplicação.';
  return m;
}
async function rpc(name, params){
  const { data, error } = await hubClient.rpc(name, params || {});
  if(error){ toast(friendlyError(error)); throw error; }
  return data;
}

async function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const msg = document.getElementById('login-msg');
  msg.textContent = 'Enviando...';
  const { error } = await hubClient.auth.signInWithOtp({
    email, options:{ emailRedirectTo: location.href.split('?')[0].split('#')[0] }
  });
  msg.textContent = error ? 'Erro ao enviar. Tenta de novo.' : 'Link enviado — confere seu e-mail.';
}

async function logout(){ await hubClient.auth.signOut(); render(); }

// Medidor do teto MEI — SEMPRE visível, independe do filtro de período do
// dash (é um acumulado do ano corrente). Faixas: verde até ~70%, amarelo a
// partir de ~85%, vermelho perto/em 100%. Acima de R$ 97.200 (120% do teto)
// o desenquadramento do MEI é RETROATIVO, com multa e juros — guarda
// financeira real, registrada no CLAUDE.md dela.
const MEI_LIMITE_RETROATIVO_CENTAVOS = 9720000; // R$ 97.200 = 120% de R$ 81.000
function velocimetroMEI(v){
  const entrado = Number(v.entrado_ano_centavos||0);
  const teto = Number(v.teto_centavos||8100000); // R$ 81.000
  const pctReal = (entrado/teto)*100;
  const pct = Math.min(pctReal, 100);
  const acimaRetroativo = entrado >= MEI_LIMITE_RETROATIVO_CENTAVOS;

  let cls = 'ok', msg = '';
  if(acimaRetroativo || entrado >= teto){
    cls = 'bad';
    msg = acimaRetroativo
      ? '🔴 Passou de R$ 97.200 — o desenquadramento do MEI já é retroativo (multa e juros).'
      : '🔴 Teto de R$ 81.000 atingido — qualquer centavo a mais aproxima do limite retroativo.';
  } else if(pctReal >= 85){
    cls = 'warn';
    msg = '🟡 Perto do teto — hora de planejar mudança de enquadramento.';
  } else if(pctReal >= 70){
    cls = 'warn';
    msg = '🟡 Passou de 70% do teto — de olho no ritmo dos próximos meses.';
  }

  return `
  <div class="card">
    <div class="row-between">
      <div class="label" style="font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--fraco);">Teto MEI — ${new Date().getFullYear()}</div>
      <div class="muted" style="font-size:12.5px;">${centavosToBRL(entrado)} de ${centavosToBRL(teto)}</div>
    </div>
    <div class="veloc">
      <div class="veloc-track"><div class="veloc-fill ${cls}" style="width:${pct.toFixed(1)}%"></div></div>
      <div class="veloc-labels"><span>0</span><span>${pctReal.toFixed(0)}%</span><span>R$ 81.000</span></div>
    </div>
    ${msg ? `<div class="veloc-msg ${cls}">${msg}</div>` : ''}
    <div class="veloc-nota">Acima de <b>R$ 97.200</b> (120% do teto) o desenquadramento do MEI é retroativo — multa e juros sobre o período todo, não só sobre o excedente.</div>
  </div>`;
}

// Gráfico de receita por período — aceita uma série genérica de buckets
// {rotulo, previsto_centavos, entrado_centavos}. Usado pelo filtro de
// período do dash (7d/30d/mês/personalizado), que decide a granularidade.
function chartReceitaPeriodo(serie){
  if(!serie.length) return `<div class="empty">Sem dados nesse período.</div>`;
  const W = 640, H = 220, padL = 8, padR = 8, padT = 24, padB = 34;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const maxVal = Math.max(...serie.map(m => Math.max(m.previsto_centavos||0, m.entrado_centavos||0)), 1) * 1.15;
  const n = serie.length;
  const slot = plotW / n;
  const barW = Math.min(28, slot * 0.42);
  // com muitos pontos (ex: 30 dias) o rótulo "DD/MM" de cada barra some;
  // mostra só ~10 rótulos espaçados pra não sobrepor um no outro.
  const rotuloStep = Math.max(1, Math.ceil(n / 10));

  const bars = serie.map((m, i) => {
    const cx = padL + slot * i + slot/2;
    const entradoH = (Number(m.entrado_centavos||0)/maxVal) * plotH;
    const previstoY = padT + plotH - (Number(m.previsto_centavos||0)/maxVal) * plotH;
    const barY = padT + plotH - entradoH;
    const label = centavosCompact(m.entrado_centavos);
    const mostraLabel = n <= 20 && entradoH > 16;
    return `
      <g>
        <rect x="${(cx-barW/2).toFixed(1)}" y="${barY.toFixed(1)}" width="${barW}" height="${Math.max(entradoH,1).toFixed(1)}"
          rx="4" fill="var(--laranja)">
          <title>${esc(m.rotulo)}: entrou ${centavosToBRL(m.entrado_centavos)} de ${centavosToBRL(m.previsto_centavos)} previsto</title>
        </rect>
        <line x1="${(cx-barW/2-3).toFixed(1)}" y1="${previstoY.toFixed(1)}" x2="${(cx+barW/2+3).toFixed(1)}" y2="${previstoY.toFixed(1)}"
          stroke="var(--fraco)" stroke-width="2" stroke-dasharray="3,3">
          <title>Previsto: ${centavosToBRL(m.previsto_centavos)}</title>
        </line>
        ${mostraLabel ? `<text x="${cx.toFixed(1)}" y="${(barY-6).toFixed(1)}" text-anchor="middle" font-size="11" fill="var(--texto)" font-weight="600">${label}</text>` : ''}
        ${(i % rotuloStep === 0 || i === n-1) ? `<text x="${cx.toFixed(1)}" y="${H-12}" text-anchor="middle" font-size="10.5" fill="var(--fraco)">${esc(m.rotulo)}</text>` : ''}
      </g>`;
  }).join('');

  const gridlines = [0,0.25,0.5,0.75,1].map(f => {
    const y = padT + plotH * (1-f);
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="var(--borda)" stroke-width="1"/>`;
  }).join('');

  const tableRows = serie.map(m => `
    <tr>
      <td data-label="Período">${esc(m.rotulo)}</td>
      <td data-label="Previsto" class="money">${centavosToBRL(m.previsto_centavos)}</td>
      <td data-label="Entrou" class="money">${centavosToBRL(m.entrado_centavos)}</td>
    </tr>`).join('');

  return `
    <div class="chart-wrap">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
        ${gridlines}
        ${bars}
      </svg>
    </div>
    <div class="chart-caption">
      <span class="key"><span class="swatch bar"></span> Quanto entrou</span>
      <span class="key"><span class="swatch target"></span> Previsto no período</span>
    </div>
    <button class="chart-toggle" onclick="this.nextElementSibling.classList.toggle('open')">ver como tabela ▾</button>
    <div class="chart-table tablewrap">
      <table><thead><tr><th>Período</th><th>Previsto</th><th>Entrou</th></tr></thead><tbody>${tableRows}</tbody></table>
    </div>`;
}

// ---------- filtro de período do dash ----------
// modo: 'ano' (padrão — receita mês a mês, série por_mes do hub_rpc_dash,
// como no mockup aprovado) | '7d' | '30d' | 'mes' | 'personalizado'
let dashFiltro = { modo: 'ano', mes: todayISO().slice(0,7) + '-01', desde: null, ate: null };
let dashCacheGlobal = null; // hub_rpc_dash() — MEI/custos/alertas, sempre não-filtrado

function addMeses(iso, n){
  const [y,m] = iso.split('-').map(Number);
  const d = new Date(Date.UTC(y, m-1+n, 1));
  return d.toISOString().slice(0,10);
}
function diasAtras(n){
  const d = new Date(todayISO()+'T00:00:00Z');
  d.setUTCDate(d.getUTCDate()+n);
  return d.toISOString().slice(0,10);
}
function fimDoMes(iso){
  const [y,m] = iso.split('-').map(Number);
  const d = new Date(Date.UTC(y, m, 0)); // dia 0 do mês seguinte = último dia do mês atual
  return d.toISOString().slice(0,10);
}
function periodoAtual(){
  if(dashFiltro.modo === '7d')  return { desde: diasAtras(-6),  ate: todayISO() };
  if(dashFiltro.modo === '30d') return { desde: diasAtras(-29), ate: todayISO() };
  if(dashFiltro.modo === 'personalizado' && dashFiltro.desde && dashFiltro.ate)
    return { desde: dashFiltro.desde, ate: dashFiltro.ate };
  // 'mes' (padrão) — ou fallback se personalizado ainda não foi preenchido
  return { desde: dashFiltro.mes, ate: fimDoMes(dashFiltro.mes) };
}
function rotuloPeriodo(){
  if(dashFiltro.modo === 'ano') return 'mês a mês';
  if(dashFiltro.modo === '7d') return 'Últimos 7 dias';
  if(dashFiltro.modo === '30d') return 'Últimos 30 dias';
  if(dashFiltro.modo === 'personalizado' && dashFiltro.desde && dashFiltro.ate)
    return `${formatDateBR(dashFiltro.desde)} — ${formatDateBR(dashFiltro.ate)}`;
  return monthLabel(dashFiltro.mes) + '/' + dashFiltro.mes.slice(0,4);
}
// Série mensal que já vem pronta no hub_rpc_dash (por_mes) — é a visão
// padrão "Receita por mês" do mockup, com a linha tracejada de meta
// (previsto) que o chartReceitaPeriodo já desenha por bucket.
function periodoDoAno(dash, vencidos){
  const porMes = dash.por_mes || [];
  return {
    previsto_centavos: porMes.reduce((s,m)=>s+Number(m.previsto_centavos||0),0),
    entrado_centavos: porMes.reduce((s,m)=>s+Number(m.entrado_centavos||0),0),
    vencidos_count: vencidos.length,
    serie: porMes.map(m => ({ rotulo: monthLabel(m.competencia)+'/'+m.competencia.slice(2,4), previsto_centavos: m.previsto_centavos, entrado_centavos: m.entrado_centavos })),
  };
}
function setFiltroDash(modo){
  dashFiltro.modo = modo;
  renderDashBody();
}
function mudarMesDash(delta){
  dashFiltro.modo = 'mes';
  dashFiltro.mes = addMeses(dashFiltro.mes, delta);
  renderDashBody();
}
function aplicarPeriodoPersonalizado(){
  const desde = document.getElementById('f-periodo-desde').value;
  const ate = document.getElementById('f-periodo-ate').value;
  if(!desde || !ate || desde > ate){ toast('Escolhe um intervalo válido.'); return; }
  dashFiltro.modo = 'personalizado';
  dashFiltro.desde = desde; dashFiltro.ate = ate;
  renderDashBody();
}

function chipsPeriodo(){
  const chip = (modo, label) => `<button class="chip ${dashFiltro.modo===modo?'on':''}" onclick="setFiltroDash('${modo}')">${label}</button>`;
  const navMes = dashFiltro.modo === 'mes' ? `
    <span class="chip-nav">
      <button class="btn btn-ico" title="Mês anterior" onclick="mudarMesDash(-1)">‹</button>
      <button class="chip on" style="cursor:default;">${monthLabel(dashFiltro.mes)}/${dashFiltro.mes.slice(0,4)}</button>
      <button class="btn btn-ico" title="Mês seguinte" onclick="mudarMesDash(1)">›</button>
    </span>` : chip('mes', 'Mês');
  return `
    <div class="chips">
      ${chip('ano','Ano')}
      ${chip('7d','7 dias')}
      ${chip('30d','30 dias')}
      ${navMes}
      <button class="chip ${dashFiltro.modo==='personalizado'?'on':''}" onclick="abrirPeriodoPersonalizado()">Personalizado</button>
    </div>
    <div id="periodo-custom-box"></div>`;
}
function abrirPeriodoPersonalizado(){
  const box = document.getElementById('periodo-custom-box');
  if(!box) return;
  const d = dashFiltro.desde || todayISO();
  const a = dashFiltro.ate || todayISO();
  box.innerHTML = `
    <div class="card" style="margin-bottom:16px;display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;">
      <div class="field" style="margin:0;"><label>De</label><input type="date" id="f-periodo-desde" value="${d}"></div>
      <div class="field" style="margin:0;"><label>Até</label><input type="date" id="f-periodo-ate" value="${a}"></div>
      <button class="btn btn-primary btn-sm" onclick="aplicarPeriodoPersonalizado()">Aplicar</button>
    </div>`;
}

async function renderDash(){
  root.innerHTML = shell('dash', `<div class="empty"><div class="spinner" style="margin:0 auto;"></div></div>`);
  try { dashCacheGlobal = await rpc('hub_rpc_dash'); }
  catch(e){ root.innerHTML = shell('dash', `<div class="empty">Não consegui carregar o dash.</div>`); return; }
  await renderDashBody();
}

async function renderDashBody(){
  const { desde, ate } = periodoAtual();
  root.innerHTML = shell('dash', `
    ${chipsPeriodo()}
    <div class="empty"><div class="spinner" style="margin:0 auto;"></div></div>
  `);

  const dash = dashCacheGlobal || {};
  const vencidos = dash.vencidos_hoje_ou_antes || [];
  const semVenc = dash.sem_vencimento || [];

  let periodo;
  if(dashFiltro.modo === 'ano'){
    // visão padrão: receita mês a mês — a série por_mes já vem no
    // hub_rpc_dash, não precisa de chamada extra nem de RPC nova.
    periodo = periodoDoAno(dash, vencidos);
  } else {
    try {
      // chamada direta (sem o wrapper rpc()) — se a migration 006 ainda não foi
      // aplicada, isso falha silenciosamente e cai no fallback abaixo, sem
      // empurrar o erro cru do Postgres pra ela em toast a cada visita ao dash.
      const { data, error } = await hubClient.rpc('hub_rpc_dash_periodo', { p_desde: desde, p_ate: ate });
      if(error) throw error;
      periodo = data;
    } catch(e){
      // RPC nova ainda não aplicada no banco (pendência de migration) — cai pro
      // agregado mensal já existente no hub_rpc_dash pra não deixar o dash vazio.
      periodo = periodoDoAno(dash, vencidos);
    }
  }
  const falta = Number(periodo.previsto_centavos||0) - Number(periodo.entrado_centavos||0);

  const alertHtml = (vencidos.length + semVenc.length) ? `
    <h2 class="section-title" style="margin-top:28px;">Precisa de atenção</h2>
    <div class="alertlist">
      ${vencidos.map(v => `
        <div class="alertrow" onclick="location.hash='#/cliente/${esc(v.cliente_slug)}'">
          <span>🔴 <b>${esc(v.cliente_nome)}</b> venceu ${v.vence_em ? 'em '+formatDateBR(v.vence_em) : ''}</span>
          <span class="money">${centavosToBRL(v.falta_centavos)}</span>
        </div>`).join('')}
      ${semVenc.map(v => `
        <div class="alertrow muted-alert" onclick="location.hash='#/cliente/${esc(v.cliente_slug)}'">
          <span>🟡 <b>${esc(v.cliente_nome)}</b> sem dia de vencimento definido</span>
          <span class="money">${centavosToBRL(v.falta_centavos)}</span>
        </div>`).join('')}
    </div>` : '';

  root.innerHTML = shell('dash', `
    ${chipsPeriodo()}

    <h2 class="section-title">${dashFiltro.modo==='ano' ? 'Receita por mês' : 'Receita — ' + esc(rotuloPeriodo())}</h2>
    <div class="card chart-card">${chartReceitaPeriodo(periodo.serie || [])}</div>

    <div class="kpis">
      <div class="kpi">
        <div class="label">Clientes ativos</div>
        <div class="value">${dash.clientes_ativos}</div>
      </div>
      <div class="kpi">
        <div class="label">Entrou ${dashFiltro.modo==='ano'?'no ano':'no período'}</div>
        <div class="value">${centavosToBRL(periodo.entrado_centavos)}</div>
      </div>
      <div class="kpi ${falta>0?'warn':''}">
        <div class="label">Falta ${dashFiltro.modo==='ano'?'no ano':'no período'}</div>
        <div class="value">${centavosToBRL(falta)}</div>
      </div>
      <div class="kpi ${(periodo.vencidos_count||vencidos.length)?'bad':''}">
        <div class="label">Vencidos</div>
        <div class="value">${periodo.vencidos_count!=null ? periodo.vencidos_count : vencidos.length}</div>
      </div>
    </div>

    ${velocimetroMEI(dash.velocimetro_mei || {})}

    <div class="kpis" style="margin-top:14px;">
      <div class="kpi">
        <div class="label">Custos fixos — negócio</div>
        <div class="value">${centavosToBRL(dash.custos_fixos?.negocio_centavos)}</div>
      </div>
      <div class="kpi">
        <div class="label">Custos fixos — pessoal</div>
        <div class="value">${centavosToBRL(dash.custos_fixos?.pessoal_centavos)}</div>
      </div>
    </div>

    ${alertHtml}
  `);
  if(dashFiltro.modo === 'personalizado') abrirPeriodoPersonalizado();
}

function kpisCarteira(rows){
  const recorrentes = rows.filter(r => r.valor_mensal_centavos != null);
  const totalMensal = recorrentes.reduce((s,r) => s + Number(r.valor_mensal_centavos), 0);
  const semVencimento = rows.filter(r => !r.tem_vencimento).length;
  const semContrato = rows.filter(r => !r.tem_contrato).length;
  return `
  <div class="kpis">
    <div class="kpi"><div class="label">Clientes ativos</div><div class="value">${rows.length}</div></div>
    <div class="kpi"><div class="label">Recorrente mensal</div><div class="value">${centavosToBRL(totalMensal)}</div></div>
    <div class="kpi ${semVencimento ? 'bad' : ''}"><div class="label">Sem dia de vencimento</div><div class="value">${semVencimento}</div></div>
    <div class="kpi ${semContrato ? 'warn' : ''}"><div class="label">Sem contrato formal</div><div class="value">${semContrato}</div></div>
  </div>`;
}

// Arquivado = status 'encerrado' (CHECK que já existe em hub.clientes).
// Nada é apagado: arquivar guarda, reativar traz de volta — sem DELETE.
let carteiraVista = 'ativos'; // 'ativos' | 'arquivados'
function setCarteiraVista(v){ carteiraVista = v; renderCarteira(); }

async function renderCarteira(){

  carteira = await rpc('hub_rpc_carteira').catch(()=>[]);

  const ativos = carteira.filter(c => c.status !== 'encerrado');
  const arquivados = carteira.filter(c => c.status === 'encerrado');
  const visiveis = carteiraVista === 'arquivados' ? arquivados : ativos;

  const rowsHtml = visiveis.map(c => `
    <tr onclick="location.hash='#/cliente/${esc(c.slug)}'">
      <td data-label="Cliente"><b>${esc(c.nome)}</b>${c.status!=='ativo' ? ` <span class="badge badge-muted" style="margin-left:6px;">${statusLabel(c.status)}</span>` : ''}</td>
      <td data-label="Serviço" class="muted">${esc(c.servico || '—')}</td>
      <td data-label="Valor mensal" class="money">${centavosToBRL(c.valor_mensal_centavos)}</td>
      <td data-label="Vencimento">${c.tem_vencimento ? ('dia ' + c.dia_vencimento) : (carteiraVista==='arquivados' ? '—' : '<span class="flag">🔴 sem vencimento</span>')}</td>
      <td data-label="Contrato">
        <span class="badge ${contratoBadgeClass(c.contrato_status)}">${statusLabel(c.contrato_status)}</span>
        ${!c.tem_contrato && carteiraVista!=='arquivados' ? '<span class="flag">🔴 sem contrato</span>' : ''}
      </td>
    </tr>
  `).join('');

  root.innerHTML = shell('carteira', `
    <div class="row-between" style="margin-bottom:14px;">
      <h2 class="section-title" style="margin:0;">Carteira</h2>
      <button class="btn btn-primary btn-sm" onclick="abrirNovoCliente()">+ Novo cliente</button>
    </div>
    ${kpisCarteira(ativos)}
    <div class="chips">
      <button class="chip ${carteiraVista==='ativos'?'on':''}" onclick="setCarteiraVista('ativos')">Ativos (${ativos.length})</button>
      <button class="chip ${carteiraVista==='arquivados'?'on':''}" onclick="setCarteiraVista('arquivados')">Arquivados (${arquivados.length})</button>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Cliente</th><th>Serviço</th><th>Valor mensal</th><th>Vencimento</th><th>Contrato</th></tr></thead>
        <tbody>${rowsHtml || `<tr><td colspan="5" class="empty">${carteiraVista==='arquivados' ? 'Nenhum cliente arquivado.' : 'Nenhum cliente cadastrado ainda.'}</td></tr>`}</tbody>
      </table>
    </div>
  `);
}

async function salvarCliente(ev){
  ev.preventDefault();
  try{
    await rpc('hub_rpc_salvar_cliente', { p: {
      empresa_id: document.getElementById('f-empresa-id').value,
      nome: document.getElementById('f-nome').value,

// PREÇOS & SERVIÇOS (rota #/catalogo — só o rótulo mudou)
// ============================================================
// MENSAL = cobra todo mês (recorrente, hospedagem); ÚNICO = cobra uma vez
// (projeto, bloco de horas, por evento) — derivado da modalidade.
function tipoServico(s){
  return (s.modalidade === 'recorrente' || s.modalidade === 'hospedagem') ? 'MENSAL' : 'ÚNICO';
}
function precoServico(s){
  if(s.preco_referencia_centavos == null) return 'negociado';
  return centavosToBRL(s.preco_referencia_centavos) + (s.unidade ? '/' + s.unidade : '');
}

let precosSelecao = false;                 // modo "montar apresentação"
let precosSelecionados = new Set();        // ids dos serviços marcados

const EDIT_ICON = `<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>`;

async function renderCatalogo(){
  root.innerHTML = shell('catalogo', `<div class="empty"><div class="spinner" style="margin:0 auto;"></div></div>`);
  const catalogo = await rpc('hub_rpc_catalogo').catch(()=>[]);
  window.__catalogo = catalogo;
  desenharCatalogo();
}

function desenharCatalogo(){
  const catalogo = window.__catalogo || [];
  const n = precosSelecionados.size;

  const cards = catalogo.map((s,i) => {
    const sel = precosSelecionados.has(s.id);
    return `
    <div class="preco-card ${s.ativo?'':'inativo'} ${precosSelecao?'selecionavel':''} ${sel?'selecionado':''}"
      ${precosSelecao ? `onclick="toggleServicoSelecionado('${esc(s.id)}')"` : ''}>
      ${precosSelecao
        ? `<input type="checkbox" class="selbox" ${sel?'checked':''} tabindex="-1" onclick="event.stopPropagation();toggleServicoSelecionado('${esc(s.id)}')">`
        : `<span class="edit"><button class="btn btn-ico" title="Editar serviço" onclick="abrirEditarServico(${i})">${EDIT_ICON}</button></span>`}
      <span class="tipo">${tipoServico(s)}${s.ativo?'':' · inativo'}</span>
      <span class="nome">${esc(s.nome)}</span>
      <span class="valor">${esc(precoServico(s))}</span>
      ${s.inclui ? `<span class="inclui">${esc(s.inclui)}</span>` : ''}
      ${s.observacao ? `<span class="obs">${esc(s.observacao)}</span>` : ''}
    </div>`;
  }).join('');

  const acoes = precosSelecao ? `
      ${n ? `<button class="btn btn-primary btn-sm" onclick="gerarApresentacao()">Gerar PDF (${n})</button>` : `<span class="muted" style="font-size:12.5px;">Marca os serviços que entram na apresentação</span>`}
      <button class="btn btn-outline btn-sm" onclick="sairModoSelecao()">Cancelar</button>` : `
      <button class="btn btn-outline btn-sm" onclick="entrarModoSelecao()">Montar apresentação</button>
      <button class="btn btn-primary btn-sm" onclick="abrirNovoServico()">+ Novo serviço</button>`;

  root.innerHTML = shell('catalogo', `
    <div class="row-between" style="margin-bottom:8px;flex-wrap:wrap;gap:10px;">
      <h2 class="section-title" style="margin:0;">Preços & Serviços</h2>
      <div class="row" style="gap:8px;">${acoes}</div>
    </div>
    <p class="muted" style="margin:0 0 18px;font-size:13px;">Preço de tabela — ponto de partida da negociação, não valor travado.</p>
    <div class="gridcards">${cards || `<div class="empty">Nenhum serviço cadastrado ainda.</div>`}</div>
    <p class="dim" style="font-size:12px;margin-top:16px;">Lembrete: todo sistema entregue sai com manutenção contratada — mensal ou avulsa. Nunca vender hora avulsa sem bloco fechado por escrito.</p>
  `);
}

function entrarModoSelecao(){ precosSelecao = true; precosSelecionados = new Set(); desenharCatalogo(); }
function sairModoSelecao(){ precosSelecao = false; precosSelecionados = new Set(); desenharCatalogo(); }
function toggleServicoSelecionado(id){
  if(precosSelecionados.has(id)) precosSelecionados.delete(id);
  else precosSelecionados.add(id);
  desenharCatalogo();
}

// ---------- apresentação em PDF (100% client-side: @media print + window.print) ----------
function gerarApresentacao(){
  const escolhidos = (window.__catalogo || []).filter(s => precosSelecionados.has(s.id));
  if(!escolhidos.length){ toast('Nenhum serviço selecionado.'); return; }

  const itens = escolhidos.map(s => `
    <div class="apres-item">
      <div class="tipo">${tipoServico(s)}</div>
      <div class="nome">${esc(s.nome)}</div>
      <div class="valor">${esc(precoServico(s))}</div>
      ${s.inclui ? `<div class="inclui">${esc(s.inclui)}</div>` : ''}
    </div>`).join('');

  const hoje = new Date().toLocaleDateString('pt-BR', { day:'2-digit', month:'long', year:'numeric' });

  modalRoot.innerHTML = `
    <div class="apres-overlay">
      <div class="apres-toolbar">
        <button class="btn btn-primary btn-sm" onclick="window.print()">Imprimir / Salvar PDF</button>
        <button class="btn btn-outline btn-sm" onclick="fecharApresentacao()">Fechar</button>
      </div>
      <div class="apres-page">
        <div class="apres-head">
          <span class="apres-logo">🐼</span>
          <div>
            <div class="apres-marca">Luh Panda</div>
            <div class="apres-tag">Automação &amp; IA para negócios</div>
          </div>
        </div>
        <div class="apres-titulo">Serviços &amp; investimento — ${esc(hoje)}</div>
        ${itens}
        <div class="apres-foot">
          <span><b>Luciana Pandolfo</b> · Luh Panda</span>
          <span>WhatsApp (84) 99412-7476 · luhpanda.com.br · lucianapandolfo9@gmail.com</span>
        </div>
      </div>
    </div>`;
  document.body.classList.add('apres-print-mode');
}
function fecharApresentacao(){
  document.body.classList.remove('apres-print-mode');
  modalRoot.innerHTML = '';
}

function abrirEditarServico(i){ openModal('Editar serviço', formServico(window.__catalogo[i])); }
async function salvarServico(ev){
  ev.preventDefault();
  try{
    await rpc('hub_rpc_salvar_servico', { p: {
      id: document.getElementById('f-id').value || undefined,

let financeiroCompetencia = null;
let financeiroCache = [];

function mudarMesFinanceiro(delta){
  financeiroCompetencia = addMeses(financeiroCompetencia, delta);
  renderFinanceiro();
}

async function renderFinanceiro(){
  if(!financeiroCompetencia) financeiroCompetencia = todayISO().slice(0,7) + '-01';
  root.innerHTML = shell('financeiro', `<div class="empty"><div class="spinner" style="margin:0 auto;"></div></div>`);
  const rows = await rpc('hub_rpc_recebiveis', { p_competencia: financeiroCompetencia }).catch(()=>[]);
  financeiroCache = rows;

  const totalPrevisto = rows.reduce((s,r)=>s+Number(r.valor_centavos),0);
  const totalEntrada = rows.reduce((s,r)=>s+Number(r.entrada_centavos),0);
  const totalVencido = rows.filter(r=>r.status==='vencido').reduce((s,r)=>s+Number(r.falta_centavos),0);
  const clientesPagos = rows.filter(r=>r.status==='pago').length;

  // Bloco 1.6, item 2: separar em "Mensalidade" (origem='contrato') e
  // "Extras do mês" (qualquer outra origem) — formato do mockup
  // (vRecebiveis, mockup-v2-frontend.html:776-809). Mantém o índice
  // original em financeiroCache (não o índice dentro do grupo filtrado)
  // pra abrirMarcarPago/abrirDesmarcarPago/abrirEditarRecebivel/abrirApagarRecebivel
  // continuarem batendo com financeiroCache[i].
  const linha = (r,i) => `
    <tr>
      <td data-label="Cliente" onclick="location.hash='#/cliente/${esc(r.cliente_slug)}'" style="cursor:pointer;"><b>${esc(r.cliente_nome)}</b>${r.origem && r.origem!=='contrato' ? ' <span class="badge badge-roxo">extra</span>' : ''}</td>
      <td data-label="Descrição" class="muted">${esc(r.descricao)}</td>
      <td data-label="Valor" class="money">${centavosToBRL(r.valor_centavos)}</td>
      <td data-label="Falta" class="money">${centavosToBRL(r.falta_centavos)}</td>
      <td data-label="Vencimento">${r.vence_em ? formatDateBR(r.vence_em) : '<span class="flag">🔴 sem venc.</span>'}</td>
      <td data-label="Status"><span class="badge ${contratoBadgeClass(r.status)}">${statusLabel(r.status)}</span></td>
      <td data-label="Ações" onclick="event.stopPropagation()">
        <div class="row" style="justify-content:flex-end;gap:6px;flex-wrap:wrap;">
          ${r.falta_centavos>0 ? `<button class="btn btn-sm btn-primary" onclick="abrirMarcarPago(${i})">Marcar pago</button>` : ''}
          ${r.entrada_centavos>0 ? `<button class="btn btn-sm btn-outline" onclick="abrirDesmarcarPago(${i})">Desmarcar</button>` : ''}
          <button class="btn btn-sm btn-outline" onclick="abrirEditarRecebivel(${i})">Editar</button>
          <button class="btn btn-sm btn-danger" onclick="abrirApagarRecebivel(${i})">Apagar</button>
        </div>
      </td>
    </tr>
  `;
  const idxMensalidade = [], idxExtras = [];
  rows.forEach((r,i) => (r.origem === 'contrato' ? idxMensalidade : idxExtras).push(i));
  const mensalidadeHtml = idxMensalidade.map(i => linha(rows[i], i)).join('');
  const extrasHtml = idxExtras.map(i => linha(rows[i], i)).join('');

  root.innerHTML = shell('financeiro', `
    <div class="row-between" style="margin-bottom:14px;flex-wrap:wrap;gap:10px;">
      <div class="row" style="gap:2px;">
        <h2 class="section-title" style="margin:0;">Financeiro</h2>
      </div>
      <button class="btn btn-primary btn-sm" onclick="abrirNovoRecebivel()">+ Novo recebível</button>
    </div>
    <div class="chips" style="margin-bottom:18px;">
      <span class="chip-nav">
        <button class="btn btn-ico" title="Mês anterior" onclick="mudarMesFinanceiro(-1)">‹</button>
        <button class="chip on" style="cursor:default;">${monthLabel(financeiroCompetencia)}/${financeiroCompetencia.slice(0,4)}</button>
        <button class="btn btn-ico" title="Mês seguinte" onclick="mudarMesFinanceiro(1)">›</button>
      </span>
    </div>
    <div class="kpis">
      <div class="kpi">
        <div class="kpi-head">${KPI_ICONS.calendar}<span class="label">Previsto</span></div>
        <div class="value">${centavosToBRL(totalPrevisto)}</div>
      </div>
      <div class="kpi">
        <div class="kpi-head">${KPI_ICONS.check}<span class="label">Entrou</span></div>
        <div class="value">${centavosToBRL(totalEntrada)}</div>
      </div>
      <div class="kpi ${totalPrevisto-totalEntrada>0?'warn':''}">
        <div class="kpi-head">${KPI_ICONS.warn}<span class="label">Falta</span></div>
        <div class="value">${centavosToBRL(totalPrevisto-totalEntrada)}</div>
      </div>
      <div class="kpi ${totalVencido>0?'bad':''}">
        <div class="kpi-head">${KPI_ICONS.clock}<span class="label">Vencidos</span></div>
        <div class="value">${centavosToBRL(totalVencido)}</div>
      </div>
      <div class="kpi">
        <div class="kpi-head">${KPI_ICONS.userCheck}<span class="label">Clientes pagos</span></div>
        <div class="value">${clientesPagos}/${rows.length}</div>
      </div>
    </div>
    <p class="eyebrow" style="color:var(--fraco);">Mensalidade</p>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Cliente</th><th>Descrição</th><th style="text-align:right">Valor</th><th style="text-align:right">Falta</th><th>Vencimento</th><th>Status</th><th></th></tr></thead>
        <tbody>${mensalidadeHtml || `<tr><td colspan="7" class="empty">Nenhuma mensalidade nesse mês.</td></tr>`}</tbody>
      </table>
    </div>
    <p class="eyebrow" style="color:var(--fraco);margin-top:22px;">Extras do mês — freelas, aulas e comissões</p>
    <div class="tablewrap">
      <table>
        <tbody>${extrasHtml || `<tr><td class="empty">Nenhum extra.</td></tr>`}</tbody>
      </table>
    </div>
  `);
}

async function abrirMarcarPago(i){
  const r = financeiroCache[i];
  openModal(`Marcar pago — ${esc(r.cliente_nome)}`, `
    <form onsubmit="return confirmarPagamento(event, '${r.id}')">
      <p class="muted" style="margin-top:0;">Falta: <b>${centavosToBRL(r.falta_centavos)}</b></p>
      <div class="field"><label>Valor recebido (R$)</label>
        <input id="f-valor" type="number" step="0.01" required value="${centavosToInputValue(r.falta_centavos)}"></div>
      <div class="field"><label>Data</label><input id="f-data" type="date" required value="${todayISO()}"></div>
      <div class="row" style="justify-content:flex-end;margin-top:16px;">
        <button type="button" class="btn btn-outline" onclick="closeModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary">Confirmar</button>
      </div>
    </form>`);
}
async function confirmarPagamento(ev, id){
  ev.preventDefault();
  try{
    const valor = brlInputToCentavos(document.getElementById('f-valor').value);
    const data = document.getElementById('f-data').value;
    await rpc('hub_rpc_marcar_pago', { p_id: id, p_valor_centavos: valor, p_data: data });
    closeModal(); toast('Pagamento registrado.'); renderFinanceiro();
  } catch(e){}
  return false;
}

let custosCache = [];

  root.innerHTML = shell('custos', `<div class="empty"><div class="spinner" style="margin:0 auto;"></div></div>`);
  custosCache = await rpc('hub_rpc_custos').catch(()=>[]);

  const total = custosCache.filter(c=>c.ativo).reduce((s,c)=>s+Number(c.valor_centavos),0);
  const negocio = custosCache.filter(c=>c.ativo && c.categoria==='negocio').reduce((s,c)=>s+Number(c.valor_centavos),0);

  const rowsHtml = custosCache.map((c,i) => `
    <tr onclick="abrirEditarCusto(${i})">
      <td data-label="Nome"><b>${esc(c.nome)}</b>${c.funcao?`<div class="muted" style="font-size:12px;">${esc(c.funcao)}</div>`:''}</td>

        <div class="kpi-head">${KPI_ICONS.user}<span class="label">Pessoal</span></div>
        <div class="value">${centavosToBRL(total-negocio)}</div>
      </div>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Nome</th><th>Categoria</th><th style="text-align:right">Valor</th><th>Vencimento</th><th>Status</th></tr></thead>

function abrirNovoCusto(){ openModal('Novo custo fixo', formCusto()); }
function abrirEditarCusto(i){ openModal('Editar custo fixo', formCusto(custosCache[i])); }
async function salvarCusto(ev){
  ev.preventDefault();
  try{
    await rpc('hub_rpc_salvar_custo', { p: {
      id: document.getElementById('f-id').value || undefined,
      nome: document.getElementById('f-nome').value,
      funcao: document.getElementById('f-funcao').value || null,
      categoria: document.getElementById('f-categoria').value,

// CONVERSAS DE WHATSAPP (Fase 3, Bloco C) — componente reutilizável
//
// UM componente só, usado em dois lugares: card "Conversa" na ficha do
// prospect e pilar "Conversas" na ficha do cliente. Quem chama só passa o
// telefone CRU (qualquer formato — o banco normaliza em hub.fone_norm) e de
// quem é a conversa.
//
// Leitura: hub_rpc_conversa_thread(p_fone) → {conversa, mensagens} ou null.
// Envio: Edge Function `wa-send` — a chave da Evolution mora LÁ, nunca aqui.
// ⚠️ A função ainda não está deployada (falta a chave). Até lá o envio falha
// com toast explícito e NADA é desenhado como se tivesse saído.
//
// rascunho_sugerido: o nó de IA do n8n escreve; aqui ele só PREENCHE o campo.
// Envio nunca acontece sozinho — mesmo princípio do aprovi.ai.
// ============================================================
const conversasCache = {};   // slotId -> { fone, prospect_id, cliente_id, dados, erro }
const conversaPollers = {};  // slotId -> intervalId, pra não empilhar poller a cada re-render
const CONVERSA_POLL_MS = 8000;
const CONVERSA_MARCA = {
  audio: '🎤 Áudio', imagem: '🖼️ Imagem', documento: '📎 Documento', outro: '📨 Mensagem',
};

function conversaSlotId(fone){ return 'conv-' + String(fone||'').replace(/\D/g,''); }

// Devolve o HTML do painel (síncrono, pra encaixar em template string) e
// agenda o carregamento pro tick seguinte, quando o innerHTML já colou o nó.
function renderConversa(fone, opts){
  opts = opts || {};
  const digitos = String(fone == null ? '' : fone).replace(/\D/g,'');
  if(digitos.length < 8){
    return `<div class="conversa-vazia">${esc(opts.semFone || 'Sem WhatsApp cadastrado.')}</div>`;
  }
  const slot = conversaSlotId(fone);
  conversasCache[slot] = {
    fone: String(fone),
    prospect_id: opts.prospect_id || null,
    cliente_id: opts.cliente_id || null,
    dados: undefined, erro: null,
  };
  setTimeout(()=>carregarConversa(slot), 0);

  // A thread só carregava uma vez, na abertura do painel — mensagem nova do
  // cliente enquanto ela estava olhando só aparecia se fechasse e reabrisse.
  // Poller silencioso repõe isso sem depender dela recarregar a página.
  if(conversaPollers[slot]) clearInterval(conversaPollers[slot]);
  conversaPollers[slot] = setInterval(()=>{
    if(!document.getElementById(slot)){
      clearInterval(conversaPollers[slot]);
      delete conversaPollers[slot];
      return;
    }
    carregarConversa(slot, { silencioso: true });
  }, CONVERSA_POLL_MS);

  return `<div class="conversa" id="${slot}">
    <div class="empty" style="padding:26px 10px;"><div class="spinner" style="margin:0 auto;"></div></div>
  </div>`;
}

async function carregarConversa(slot, opts){
  const st = conversasCache[slot];
  if(!st || !document.getElementById(slot)) return;
  const silencioso = !!(opts && opts.silencioso);
  try{
    const dados = await rpc('hub_rpc_conversa_thread', { p_fone: st.fone });
    st.dados = dados;
    st.erro = null;
  } catch(e){
    // poll silencioso: um erro passageiro de rede não pode apagar a thread
    // que já estava na tela nem incomodar com toast a cada 8s.
    if(silencioso) return;
    st.dados = null;
    st.erro = friendlyError(e);
  }
  desenharConversa(slot);
}

function desenharConversa(slot){
  const st = conversasCache[slot];
  const box = document.getElementById(slot);
  if(!st || !box) return;

  const conversa = (st.dados && st.dados.conversa) || null;
  const msgs = (st.dados && st.dados.mensagens) || [];
  const rascunho = (conversa && conversa.rascunho_sugerido) || '';

  // Redesenho (poller ou envio) troca o innerHTML inteiro, textarea incluída.
  // Se ela já estava digitando uma resposta, isso apagaria o texto no meio da
  // digitação — guarda o que já estava no campo e devolve depois do redraw.
  const campoAntigo = document.getElementById(slot + '-texto');
  const textoEmDigitacao = campoAntigo ? campoAntigo.value : '';

  // mais antigas em cima — o banco já devolve ordenado por enviada_em
  const bolhas = msgs.map(m => {
    const entrada = m.direcao === 'entrada';
    const midia = m.tipo && m.tipo !== 'texto';
    let miolo;
    if(midia && !m.transcrito){
      // corpo vazio de propósito: arquivo não é guardado, só o marcador
      miolo = `<span class="marca">${esc(CONVERSA_MARCA[m.tipo] || CONVERSA_MARCA.outro)}</span>`;
    } else {
      miolo = `<span class="corpo">${esc(m.corpo || '')}</span>`;
      if(midia && m.transcrito){
        miolo += `<span class="transcrito">${esc(CONVERSA_MARCA[m.tipo] || CONVERSA_MARCA.outro)} · transcrito</span>`;
      }
    }
    const falhou = !entrada && m.status === 'erro';
    return `<div class="bolha ${entrada?'entrada':'saida'} ${falhou?'erro':''}">
      ${miolo}
      ${falhou ? `<span class="falhou">não saiu${m.erro ? ' — ' + esc(truncar(m.erro, 90)) : ''}</span>` : ''}
      <span class="carimbo">${esc(carimboMsg(m.enviada_em))}${!entrada && m.status === 'enviando' ? ' · enviando' : ''}</span>
    </div>`;
  }).join('');

  const vazio = st.erro
    ? `<div class="conversa-vazia">Não deu pra carregar a conversa — ${esc(st.erro)}</div>`
    : `<div class="conversa-vazia">Nenhuma mensagem ainda.</div>`;

  // Só força rolar pro fim se ela já estava perto do fim (ou é a primeira
  // vez abrindo). Se rolou pra cima pra ler histórico, o poller de 8s não
  // pode ficar puxando a tela de volta pra baixo debaixo dela.
  const threadAntiga = document.getElementById(slot + '-thread');
  const permanecerNoFim = !threadAntiga ||
    (threadAntiga.scrollHeight - threadAntiga.scrollTop - threadAntiga.clientHeight < 80);

  // Ela está com o cursor no campo de resposta agora? Trocar o innerHTML
  // inteiro derrubaria o foco e a posição do cursor a cada poll de 8s.
  // Nesse caso só atualiza a thread (mensagens novas) e deixa a caixa de
  // texto em paz — ela continua digitando sem perceber o refresh.
  if(campoAntigo && document.activeElement === campoAntigo){
    if(threadAntiga) threadAntiga.innerHTML = bolhas || vazio;
    if(threadAntiga && permanecerNoFim) threadAntiga.scrollTop = threadAntiga.scrollHeight;
    return;
  }

  box.innerHTML = `
    <div class="conversa-thread" id="${slot}-thread">${bolhas || vazio}</div>
    <div class="conversa-envio">
      ${rascunho ? `<div class="conversa-dica">✨ sugestão da IA — edite antes de mandar</div>` : ''}
      <textarea id="${slot}-texto" rows="2" placeholder="Escreva a resposta...">${esc(textoEmDigitacao || rascunho)}</textarea>
      <div class="conversa-acoes">
        <button class="btn btn-primary btn-sm" id="${slot}-enviar" onclick="enviarConversa('${slot}')">Enviar</button>
      </div>
    </div>`;

  const th = document.getElementById(slot + '-thread');
  if(th && permanecerNoFim) th.scrollTop = th.scrollHeight;   // abre já no fim da conversa
}

// Erro de envio em linguagem de gente. Enquanto a Edge Function não estiver
// deployada, qualquer tentativa cai no primeiro caso — e a tela deixa claro
// que NÃO saiu.
function erroEnvioWhats(err){
  const m = (err && err.message) || String(err);
  if(/not found|404|failed to (send|fetch)|networkerror|failed to fetch|non-2xx/i.test(m)){
    return 'Envio ainda não ativado — falta configurar a chave da Evolution.';
  }
  return 'A mensagem NÃO foi enviada: ' + m;
}

// Envio OTIMISTA. A Evolution leva ~1,5s pra entregar de verdade e isso não
// tem como acelerar — é a conversa da VPS com o servidor do WhatsApp. O que
// dá pra evitar é ela ficar olhando pra uma tela parada nesse tempo: a bolha
// entra na hora, marcada como "enviando", e vira confirmada ou falha depois.
// É o mesmo comportamento do WhatsApp, e é honesto — o estado pendente
// aparece, não finge que já chegou.
async function enviarConversa(slot){
  const st = conversasCache[slot];
  const ta = document.getElementById(slot + '-texto');
  if(!st || !ta) return;
  const corpo = ta.value.trim();
  if(!corpo){ toast('Escreve a mensagem antes de enviar.'); return; }
  if(!hubClient.functions){ toast('Envio ainda não ativado — falta configurar a chave da Evolution.'); return; }

  const provisoria = {
    id: 'tmp-' + Date.now(),
    direcao: 'saida',
    corpo: corpo,
    tipo: 'texto',
    transcrito: false,
    enviada_em: new Date().toISOString(),
    status: 'enviando',
    erro: null,
  };
  if(!st.dados) st.dados = { conversa: null, mensagens: [] };
  if(!st.dados.mensagens) st.dados.mensagens = [];
  st.dados.mensagens.push(provisoria);
  // o rascunho da IA já foi usado; não pode voltar no redesenho
  if(st.dados.conversa) st.dados.conversa.rascunho_sugerido = '';
  ta.value = '';
  desenharConversa(slot);

  try{
    const { data, error } = await hubClient.functions.invoke('wa-send', {
      body: { fone: st.fone, corpo: corpo, prospect_id: st.prospect_id, cliente_id: st.cliente_id },
    });
    if(error) throw error;
    if(data && data.erro) throw new Error(data.erro);
    conversasResumo = null;          // kanban recarrega a prévia na próxima visita
    await carregarConversa(slot);    // troca a provisória pela linha real do banco
  } catch(e){
    // Não saiu: a bolha vira "não saiu" com o motivo, e o texto volta pro campo
    // pra ela não perder o que escreveu.
    provisoria.status = 'erro';
    provisoria.erro = erroEnvioWhats(e);
    desenharConversa(slot);
    const campo = document.getElementById(slot + '-texto');
    if(campo && !campo.value) campo.value = corpo;
    toast(erroEnvioWhats(e));
  }
}

// FICHA DO CLIENTE (abas por pilar)
// ============================================================
let clienteAtual = null;
let pilarAtivo = 'financeiro';
let contatoConversaId = null;   // qual contato do cliente está aberto no pilar Conversas

async function renderCliente(slug){
  root.innerHTML = shell('carteira', `<div class="empty"><div class="spinner" style="margin:0 auto;"></div></div>`);
  const data = await rpc('hub_rpc_cliente', { p_slug: slug }).catch(()=>null);
  if(!data){ root.innerHTML = shell('carteira', `<div class="empty">Cliente não encontrado.</div>`); return; }
  // demandas vêm de RPC própria (migration 007) — chamada direta sem o
  // wrapper rpc() pra não estourar toast enquanto a migration não estiver
  // aplicada; `null` = função ainda não existe no banco, a seção avisa.
  try {
    const { data: dem, error } = await hubClient.rpc('hub_rpc_demandas_cliente', { p_cliente_id: data.cliente.id });
    data.demandas = error ? null : (dem || []);
  } catch(e){ data.demandas = null; }
  clienteAtual = data;
  pilarAtivo = 'financeiro';
  contatoConversaId = null;
  desenharFichaCliente();
}

function desenharFichaCliente(){
  const data = clienteAtual;
  const c = data.cliente;
  const arquivado = c.status === 'encerrado';

  root.innerHTML = shell('carteira', `
    <div style="margin-bottom:18px;">
      <a href="#/carteira" class="muted" style="text-decoration:none;font-size:13px;">← voltar pra carteira</a>
    </div>
    <div class="row-between" style="align-items:flex-start;margin-bottom:6px;flex-wrap:wrap;gap:10px;">
      <div>
        <h1 style="margin:0 0 4px;font-size:24px;">${esc(c.nome)}</h1>
        <span class="badge ${c.status==='ativo'?'badge-ok':'badge-muted'}">${statusLabel(c.status)}</span>
        ${c.segmento ? `<span class="muted" style="margin-left:8px;">${esc(c.segmento)}</span>` : ''}
      </div>
      <div class="row" style="gap:8px;flex-wrap:wrap;">
        ${arquivado
          ? `<button class="btn btn-primary btn-sm" onclick="abrirReativarCliente()">Reativar</button>`
          : `<button class="btn btn-danger btn-sm" onclick="abrirArquivarCliente()">Arquivar</button>`}
        <button class="btn btn-outline btn-sm" onclick="abrirEditarClienteFicha()">Editar cliente</button>
      </div>
    </div>
    ${arquivado ? `<div class="card" style="margin:14px 0;border-color:rgba(242,193,78,.35);">
      <span class="muted">📦 Cliente arquivado${c.saiu_em ? ' em ' + formatDateBR(c.saiu_em) : ''}${c.motivo_saida ? ' — ' + esc(c.motivo_saida) : ''}. Nada foi apagado — o histórico continua todo aqui, e dá pra reativar quando quiser.</span>
    </div>` : ''}
    ${c.observacao ? `<div class="card" style="margin:14px 0;"><span class="muted">${esc(c.observacao)}</span></div>` : ''}

    <div class="pilartabs">
      <div class="pilartab ${pilarAtivo==='financeiro'?'active':''}" onclick="trocarPilar('financeiro', event)">Financeiro</div>
      <div class="pilartab ${pilarAtivo==='marketing'?'active':''}" onclick="trocarPilar('marketing', event)">Marketing</div>
      <div class="pilartab ${pilarAtivo==='comercial'?'active':''}" onclick="trocarPilar('comercial', event)">Comercial</div>
      <div class="pilartab ${pilarAtivo==='conversas'?'active':''}" onclick="trocarPilar('conversas', event)">Conversas</div>
    </div>
    <div id="pilar-body">${renderPilar()}</div>

    <div class="row-between" style="margin-top:32px;margin-bottom:12px;">
      <h2 class="section-title" style="margin:0;">Demandas</h2>
      ${data.demandas !== null ? `<button class="btn btn-sm btn-outline" onclick="abrirNovaDemanda()">+ Nova demanda</button>` : ''}
    </div>
    ${renderDemandas()}
  `);
}
function trocarPilar(p, ev){
  pilarAtivo = p;
  document.getElementById('pilar-body').innerHTML = renderPilar();
  document.querySelectorAll('.pilartab').forEach(el=>el.classList.remove('active'));
  if(ev && ev.target) ev.target.classList.add('active');
}

function renderPilar(){
  if(pilarAtivo === 'marketing') return `<div class="pilar-empty">Em construção — próxima fase do hub.</div>`;
  if(pilarAtivo === 'comercial') return `<div class="pilar-empty">Em construção — próxima fase do hub.</div>`;
  if(pilarAtivo === 'conversas') return renderPilarConversas();
  return renderPilarFinanceiro();
}

// Pilar Conversas — mesmo componente da ficha do prospect. O telefone vem de
// hub.contatos (whatsapp_e164), preferindo o contato principal; se o cliente
// tiver mais de um WhatsApp, ela escolhe qual thread ver.
function renderPilarConversas(){
  const cliente = clienteAtual.cliente;
  const comZap = (clienteAtual.contatos || [])
    .filter(ct => String(ct.whatsapp_e164 || '').replace(/\D/g,'').length >= 8);

  if(!comZap.length){
    return `<div class="pilar-empty">Nenhum contato com WhatsApp cadastrado.<br>
      Adicione o WhatsApp do contato na aba Financeiro pra conversa aparecer aqui.</div>`;
  }

  if(!contatoConversaId || !comZap.some(ct => ct.id === contatoConversaId)){
    contatoConversaId = (comZap.find(ct => ct.is_principal) || comZap[0]).id;
  }
  const atual = comZap.find(ct => ct.id === contatoConversaId);

  const seletor = comZap.length > 1 ? `<div class="chips">
    ${comZap.map(ct => `<button class="chip ${ct.id===contatoConversaId?'on':''}"
      onclick="trocarContatoConversa('${esc(ct.id)}')">${esc(ct.nome)}${ct.is_principal?' ★':''}</button>`).join('')}
  </div>` : '';

  return `${seletor}
    <div class="card">
      <div class="row-between" style="margin-bottom:10px;gap:10px;flex-wrap:wrap;">
        <p class="eyebrow" style="color:var(--fraco);margin:0;">Conversa</p>
        <span class="dim" style="font-size:11.5px;">${esc(atual.nome)} · ${esc(atual.whatsapp_e164)}</span>
      </div>
      ${renderConversa(atual.whatsapp_e164, { cliente_id: cliente.id })}
    </div>`;
}
function trocarContatoConversa(id){
  contatoConversaId = id;
  document.getElementById('pilar-body').innerHTML = renderPilar();
}

function renderPilarFinanceiro(){
  const data = clienteAtual;
  const contatos = data.contatos || [];
  const contratos = data.contratos || [];

  const contatosHtml = contatos.length ? contatos.map((ct,i) => `
    <div class="row-between" style="padding:9px 0;border-top:1px solid var(--line);">
      <div><b>${esc(ct.nome)}</b> <span class="muted">${esc(ct.papel||'')}</span>
        <div class="muted" style="font-size:12px;">${esc(ct.whatsapp_e164 || '')} ${ct.email?'· '+esc(ct.email):''}</div>
      </div>
      <div class="row">
        ${ct.is_principal ? '<span class="badge badge-ok">Principal</span>' : ''}
        <button class="btn btn-sm btn-outline" onclick="abrirEditarContato(${i})">Editar</button>
      </div>
    </div>`).join('') : `<div class="muted">Nenhum contato cadastrado.</div>`;

  const contratosHtml = contratos.length ? contratos.map((item,i) => {
    const co = item.contrato;
    const itens = item.itens || [];
    return `
    <div class="card" style="margin-bottom:12px;">
      <div class="row-between" style="flex-wrap:wrap;gap:8px;">
        <div>
          <span class="badge ${contratoBadgeClass(co.status)}">${statusLabel(co.status)}</span>
          ${co.numero ? `<span class="muted" style="margin-left:8px;">nº ${esc(co.numero)}</span>` : ''}
        </div>
        <div class="row" style="flex-wrap:wrap;gap:6px;">
          <div class="money">${centavosToBRL(co.valor_mensal_centavos)}${co.dia_vencimento ? ' · dia '+co.dia_vencimento : ''}</div>
          <button class="btn btn-sm btn-outline" onclick="abrirEditarContrato(${i})">Editar</button>
          <button class="btn btn-sm btn-danger" onclick="abrirApagarContrato(${i})">Apagar</button>
        </div>
      </div>
      ${itens.length ? `<ul style="margin:12px 0 0;padding-left:18px;color:var(--muted);font-size:13px;">
        ${itens.map(it => `<li>${esc(it.descricao)} — ${centavosToBRL(it.valor_centavos)}</li>`).join('')}
      </ul>` : ''}
      ${co.porta_saida_escrita_em
        ? `<div class="muted" style="margin-top:10px;font-size:12.5px;">✓ Porta de saída escrita (${esc(co.porta_saida_tipo || 'nenhuma')})</div>`
        : `<div class="flag" style="margin-top:10px;">🔴 sem porta de saída escrita</div>`}
      ${co.observacao ? `<div class="muted" style="margin-top:8px;font-size:12.5px;">${esc(co.observacao)}</div>` : ''}
    </div>`;
  }).join('') : `<div class="muted">Nenhum contrato registrado.</div>`;

  return `
    <div class="row-between" style="margin-bottom:12px;">
      <h2 class="section-title" style="margin:0;">Contratos</h2>
      <button class="btn btn-sm btn-outline" onclick="abrirNovoContrato()">+ Novo contrato</button>
    </div>
    ${contratosHtml}

    <div class="row-between" style="margin-top:28px;margin-bottom:12px;">
      <h2 class="section-title" style="margin:0;">Contatos</h2>
      <button class="btn btn-sm btn-outline" onclick="abrirNovoContato()">+ Novo contato</button>
    </div>
    <div class="card">${contatosHtml}</div>`;
}

  const c = clienteAtual.cliente;
  openModal('Editar cliente', `
    <form onsubmit="return salvarClienteFicha(event)">
      <input type="hidden" id="f-id" value="${esc(c.id)}">
      <input type="hidden" id="f-empresa-id" value="${esc(c.empresa_id)}">
      <div class="field"><label>Nome</label><input id="f-nome" required value="${esc(c.nome)}"></div>
      <div class="field"><label>Slug</label><input id="f-slug" required value="${esc(c.slug)}"></div>
      <div class="field"><label>Segmento</label><input id="f-segmento" value="${esc(c.segmento||'')}"></div>
      <div class="field"><label>Status</label>
        <select id="f-status">
          ${['prospect','ativo','pausado','encerrado'].map(s=>`<option value="${s}" ${c.status===s?'selected':''}>${statusLabel(s)}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Observação</label><textarea id="f-observacao" rows="3">${esc(c.observacao||'')}</textarea></div>
      <div class="row" style="justify-content:flex-end;margin-top:16px;">
        <button type="button" class="btn btn-outline" onclick="closeModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar</button>
      </div>

}
async function salvarClienteFicha(ev){
  ev.preventDefault();
  const c = clienteAtual.cliente;
  try{
    await rpc('hub_rpc_salvar_cliente', { p: {
      id: document.getElementById('f-id').value,
      empresa_id: document.getElementById('f-empresa-id').value,
      nome: document.getElementById('f-nome').value,
      slug: document.getElementById('f-slug').value,
      segmento: document.getElementById('f-segmento').value || null,
      status: document.getElementById('f-status').value,
      observacao: document.getElementById('f-observacao').value || null,
      // passthrough obrigatório: o upsert do banco sobrescreve TODAS as
      // colunas — sem repassar o que a ficha não edita, salvar apagaria
      // razão social, documento, origem e as datas de entrada/saída.
      razao_social: c.razao_social, documento: c.documento, origem: c.origem,
      entrou_em: c.entrou_em, saiu_em: c.saiu_em, motivo_saida: c.motivo_saida,
    }});
    const novoSlug = document.getElementById('f-slug').value;
    closeModal(); toast('Cliente salvo.');
    location.hash = '#/cliente/' + novoSlug;
    renderCliente(novoSlug);
  } catch(e){}
  return false;
}

// ---- arquivar / reativar (item 2 do Bloco 1.5) ----
// Arquivar NUNCA apaga: usa o status 'encerrado' que já existe no CHECK de
// hub.clientes + saiu_em/motivo_saida. Reversível pelo botão "Reativar".
async function salvarClientePatch(patch, msg){
  const c = clienteAtual.cliente;
  await rpc('hub_rpc_salvar_cliente', { p: {
    id: c.id, empresa_id: c.empresa_id, nome: c.nome, slug: c.slug,
    razao_social: c.razao_social, documento: c.documento, segmento: c.segmento,
    origem: c.origem, status: c.status, entrou_em: c.entrou_em,
    saiu_em: c.saiu_em, motivo_saida: c.motivo_saida, observacao: c.observacao,
    ...patch,
  }});
  closeModal(); toast(msg);
  renderCliente(c.slug);
}
function abrirArquivarCliente(){
  const c = clienteAtual.cliente;

function demandaBadgeClass(status){

  if(!dems.length) return `<div class="card"><span class="muted">Nenhuma demanda deste cliente.</span></div>`;

  const hoje = todayISO();
  const rows = dems.map((d,i) => {

        ${d.status !== 'entregue' ? `<button class="btn btn-sm btn-primary" onclick="marcarDemandaEntregue(${i})">Entregue</button>` : ''}
        <button class="btn btn-sm btn-outline" onclick="abrirEditarDemanda(${i})">Editar</button>
